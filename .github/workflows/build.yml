name: Build Hoenn Reborn 3DS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Hoenn Reborn project
        run: |
          mkdir -p project
          unzip -o Hoenn_Reborn_GitHub_Build.zip -d project

      - name: Install 3DS development libraries
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --needed --noconfirm \
            3ds-dev \
            3ds-cmake

      - name: Download mGBA 0.10.5
        run: |
          git clone \
            --depth 1 \
            --branch 0.10.5 \
            https://github.com/mgba-emu/mgba.git \
            mgba

      - name: Configure mGBA
        run: |
          mkdir -p mgba/build

          cmake \
            -S mgba \
            -B mgba/build \
            -DCMAKE_TOOLCHAIN_FILE=mgba/src/platform/3ds/CMakeToolchain.txt \
            -DCMAKE_BUILD_TYPE=Release \
            -D3DS=ON \
            -DLIBMGBA_ONLY=ON \
            -DBUILD_STATIC=ON \
            -DBUILD_SHARED=OFF \
            -DSKIP_LIBRARY=OFF \
            -DM_CORE_GBA=ON \
            -DM_CORE_GB=OFF \
            -DDISABLE_DEPS=ON \
            -DBUILD_LTO=OFF \
            -DUSE_PNG=OFF \
            -DUSE_ZLIB=OFF \
            -DENABLE_SCRIPTING=OFF \
            -DBUILD_TEST=OFF \
            -DBUILD_SUITE=OFF \
            -DBUILD_EXAMPLE=OFF \
            -DBUILD_PERF=OFF

      - name: Build mGBA core
        run: |
          cmake \
            --build mgba/build \
            --target mgba \
            --parallel 2

      - name: Prepare mGBA for Hoenn Reborn
        run: |
          echo "===== Searching for mGBA libraries ====="

          find mgba/build \
            -type f \
            \( -name "libmgba*.a" -o -name "libmgba*.so" \) \
            -print

          echo "===== Searching for generated headers ====="

          find mgba/build/include \
            -type f \
            -print 2>/dev/null || true

          mkdir -p \
            project/mgba/build-hoenn-3ds \
            project/mgba/build-hoenn-3ds/include

          LIB=""

          if [ -f mgba/build/libmgba.a ]; then
            LIB="mgba/build/libmgba.a"
          fi

          if [ -z "$LIB" ]; then
            LIB=$(find mgba/build \
              -type f \
              -name "libmgba.a" \
              | head -n 1)
          fi

          if [ -z "$LIB" ]; then
            echo "ERROR: Could not find libmgba.a"
            exit 1
          fi

          echo "Using mGBA library:"
          echo "$LIB"

          cp "$LIB" \
            project/mgba/build-hoenn-3ds/libmgba-static.a

          if [ -d mgba/build/include ]; then
            cp -R mgba/build/include/. \
              project/mgba/build-hoenn-3ds/include/
          fi

          echo "===== Prepared library ====="
          ls -lh \
            project/mgba/build-hoenn-3ds/libmgba-static.a

      - name: Verify project files
        run: |
          echo "===== Hoenn Reborn project ====="

          find project \
            -maxdepth 3 \
            -type f \
            | sort

          echo "===== mGBA library ====="

          ls -lh \
            project/mgba/build-hoenn-3ds/libmgba-static.a

      - name: Build Hoenn Reborn
        working-directory: project
        run: |
          make clean || true
          make -j2

      - name: Check build outputs
        run: |
          echo "===== BUILD OUTPUTS ====="

          find project \
            -type f \
            \( \
              -name "*.cia" \
              -o -name "*.3dsx" \
              -o -name "*.elf" \
            \) \
            -print

      - name: Upload CIA
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-CIA
          path: |
            project/**/*.cia
          if-no-files-found: error

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-3DSX
          path: |
            project/**/*.3dsx
          if-no-files-found: warn

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-ELF
          path: |
            project/**/*.elf
          if-no-files-found: warn

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-build-logs
          path: |
            mgba/build/CMakeCache.txt
            mgba/build/CMakeFiles/**
            project/mgba/build-hoenn-3ds/**
