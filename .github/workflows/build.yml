name: Build Hoenn Reborn

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # BASIC LINUX TOOLS
      # ============================================================

      - name: Install Linux build tools
        run: |
          apt-get update
          apt-get install -y \
            wget \
            curl \
            git \
            cmake \
            make \
            python3 \
            unzip \
            xz-utils \
            zstd \
            file

      # ============================================================
      # DEVKITPRO ENVIRONMENT
      # ============================================================

      - name: Configure devkitPro environment
        shell: bash
        run: |
          echo "/opt/devkitpro/devkitARM/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/portlibs/3ds/bin" >> "$GITHUB_PATH"

          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM

          echo "DEVKITPRO=$DEVKITPRO" >> "$GITHUB_ENV"
          echo "DEVKITARM=$DEVKITARM" >> "$GITHUB_ENV"

      # ============================================================
      # DEVKITPRO CMAKE + CATNIP
      # ============================================================

      - name: Install devkitPro CMake helpers
        shell: bash
        run: |
          set -e

          cd /tmp

          # --------------------------------------------------------
          # 3DS CMake package
          # --------------------------------------------------------

          wget -O 3ds-cmake.pkg.tar.zst \
            https://wii.leseratte10.de/devkitPro/cmake/3ds-cmake-1.5.2-1-any.pkg.tar.zst

          rm -rf /tmp/3ds-cmake
          mkdir -p /tmp/3ds-cmake

          tar \
            --use-compress-program=unzstd \
            -xf 3ds-cmake.pkg.tar.zst \
            -C /tmp/3ds-cmake

          echo "Installing 3DS CMake files..."

          cp -a \
            /tmp/3ds-cmake/opt/devkitpro/. \
            /opt/devkitpro/

          # --------------------------------------------------------
          # Catnip
          # --------------------------------------------------------

          wget -O catnip.pkg.tar.zst \
            https://wii.leseratte10.de/devkitPro/other-stuff/catnip-0.2.0-1-any.pkg.tar.zst

          rm -rf /tmp/catnip
          mkdir -p /tmp/catnip

          tar \
            --use-compress-program=unzstd \
            -xf catnip.pkg.tar.zst \
            -C /tmp/catnip

          echo "Installing Catnip..."

          cp -a \
            /tmp/catnip/opt/devkitpro/. \
            /opt/devkitpro/

          # --------------------------------------------------------
          # Show installed CMake tools
          # --------------------------------------------------------

          echo "Installed devkitPro CMake files:"

          find /opt/devkitpro \
            -type f \
            \( \
              -name 'arm-none-eabi-cmake' \
              -o \
              -name '3DS.cmake' \
              -o \
              -name '*catnip*' \
            \) \
            -print \
            2>/dev/null || true

          echo "devkitPro CMake helper installation complete."

      # ============================================================
      # VERIFY DEVKITPRO CMAKE
      # ============================================================

      - name: Verify devkitPro CMake
        shell: bash
        run: |
          set -e

          export PATH="/opt/devkitpro/portlibs/3ds/bin:$PATH"
          export PATH="/opt/devkitpro/tools/bin:$PATH"
          export PATH="/opt/devkitpro/devkitARM/bin:$PATH"

          echo "Searching for arm-none-eabi-cmake..."

          CMAKE3DS="$(
            find /opt/devkitpro \
              -type f \
              -name arm-none-eabi-cmake \
              -print \
              -quit
          )"

          if [ -z "$CMAKE3DS" ]; then
            echo "ERROR: arm-none-eabi-cmake was not found."
            exit 1
          fi

          echo "Found:"
          echo "$CMAKE3DS"

          chmod +x "$CMAKE3DS"

          "$CMAKE3DS" --version

          echo "devkitPro CMake is ready."

      # ============================================================
      # 3DS TOOLS
      # ============================================================

      - name: Install 3dstools
        shell: bash
        run: |
          set -e

          cd /tmp

          wget -O 3dstools.pkg.tar.zst \
            https://wii.leseratte10.de/devkitPro/other-stuff/3dstools/3dstools-1.3.1-3-linux_x86_64.pkg.tar.zst

          rm -rf /tmp/3dstools
          mkdir -p /tmp/3dstools

          tar \
            --use-compress-program=unzstd \
            -xf 3dstools.pkg.tar.zst \
            -C /tmp/3dstools

          if [ -d /tmp/3dstools/opt/devkitpro/tools ]; then
            cp -a \
              /tmp/3dstools/opt/devkitpro/tools/. \
              /opt/devkitpro/tools/
          fi

          if [ -d /tmp/3dstools/usr/bin ]; then
            cp -a \
              /tmp/3dstools/usr/bin/. \
              /opt/devkitpro/tools/bin/
          fi

          find /opt/devkitpro/tools \
            -type f \
            \( -name tex3ds -o -name 3dsxtool \) \
            -exec chmod +x {} \; \
            2>/dev/null || true

          echo "3dstools installation complete."

      # ============================================================
      # BANNERTOOL
      # ============================================================

      - name: Install bannertool
        shell: bash
        run: |
          set -e

          cd /tmp

          wget -O bannertool.zip \
            https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip

          rm -rf /tmp/bannertool
          mkdir -p /tmp/bannertool

          unzip -q bannertool.zip -d /tmp/bannertool

          BANNERTOOL_BIN="/tmp/bannertool/linux-x86_64/bannertool"

          test -f "$BANNERTOOL_BIN"

          chmod +x "$BANNERTOOL_BIN"

          cp "$BANNERTOOL_BIN" \
            /opt/devkitpro/tools/bin/bannertool

          chmod +x \
            /opt/devkitpro/tools/bin/bannertool

          echo "bannertool installation complete."

      # ============================================================
      # MAKEROM
      # ============================================================

      - name: Install makerom
        shell: bash
        run: |
          set -e

          cd /tmp

          wget -O makerom.zip \
            https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip

          rm -rf /tmp/makerom
          mkdir -p /tmp/makerom

          unzip -q makerom.zip -d /tmp/makerom

          MAKEROM_BIN="$(
            find /tmp/makerom \
              -type f \
              -name makerom \
              -print \
              -quit
          )"

          test -n "$MAKEROM_BIN"

          chmod +x "$MAKEROM_BIN"

          cp "$MAKEROM_BIN" \
            /opt/devkitpro/tools/bin/makerom

          chmod +x \
            /opt/devkitpro/tools/bin/makerom

          echo "makerom installation complete."

      # ============================================================
      # VERIFY TOOLS
      # ============================================================

      - name: Verify 3DS tools
        shell: bash
        run: |
          set -e

          export PATH="/opt/devkitpro/portlibs/3ds/bin:$PATH"
          export PATH="/opt/devkitpro/tools/bin:$PATH"
          export PATH="/opt/devkitpro/devkitARM/bin:$PATH"

          echo "ARM compiler:"
          command -v arm-none-eabi-gcc

          echo "3DS CMake:"
          command -v arm-none-eabi-cmake

          echo "bannertool:"
          command -v bannertool

          echo "makerom:"
          command -v makerom

          echo "tex3ds:"
          command -v tex3ds

          echo "3dsxtool:"
          command -v 3dsxtool

          echo "All required tools are available."

      # ============================================================
      # BUILD LIBCTRU
      # ============================================================

      - name: Build libctru
        shell: bash
        run: |
          set -e

          cd /tmp

          rm -rf /tmp/libctru
          mkdir -p /tmp/libctru

          wget -O libctru.tar.gz \
            https://github.com/devkitPro/libctru/archive/refs/tags/v2.7.0.tar.gz

          tar \
            -xzf libctru.tar.gz \
            -C /tmp/libctru

          LIBCTRU_ROOT="$(
            find /tmp/libctru/libctru-2.7.0 \
              -type f \
              -name Makefile \
              -print \
              -quit \
              | xargs dirname
          )"

          test -n "$LIBCTRU_ROOT"
          test -f "$LIBCTRU_ROOT/Makefile"

          GDBHIO_FILE="$(
            find /tmp/libctru/libctru-2.7.0 \
              -type f \
              -name gdbhio.c \
              -print \
              -quit
          )"

          test -n "$GDBHIO_FILE"

          echo "Patching:"
          echo "$GDBHIO_FILE"

          python3 - "$GDBHIO_FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])
          text = p.read_text()

          pattern = re.compile(
              r'(?m)^(\s*)gdbhio_mode_t\s+gdbMode\s*=\s*0\s*;\s*$'
          )

          match = pattern.search(text)

          if match:
              replacement = (
                  match.group(1)
                  + "gdbhio_mode_t gdbMode "
                    "__attribute__((unused)) = 0;"
              )

              text = (
                  text[:match.start()]
                  + replacement
                  + text[match.end():]
              )

              p.write_text(text)

              print("gdbMode declaration patched successfully.")

          elif (
              "__attribute__((unused))" in text
              and "gdbMode" in text
          ):
              print("gdbMode was already patched.")

          else:
              raise SystemExit(
                  "ERROR: gdbMode declaration not found."
              )
          PY

          grep -n \
            "gdbhio_mode_t gdbMode" \
            "$GDBHIO_FILE"

          grep -q \
            "gdbMode __attribute__((unused))" \
            "$GDBHIO_FILE"

          cd "$LIBCTRU_ROOT"

          make -j2
          make install

          echo "libctru build/install complete."

      # ============================================================
      # BUILD CITRO3D
      # ============================================================

      - name: Build citro3d
        shell: bash
        run: |
          set -e

          cd /tmp

          rm -rf /tmp/citro3d
          mkdir -p /tmp/citro3d

          wget -O citro3d.tar.gz \
            https://github.com/devkitPro/citro3d/archive/refs/tags/v1.7.1.tar.gz

          tar \
            -xzf citro3d.tar.gz \
            -C /tmp/citro3d

          CITRO3D_ROOT="/tmp/citro3d/citro3d-1.7.1"

          test -f "$CITRO3D_ROOT/Makefile"

          cd "$CITRO3D_ROOT"

          make -j2
          make install

          echo "citro3d build/install complete."

      # ============================================================
      # BUILD CITRO2D
      # ============================================================

      - name: Build citro2d
        shell: bash
        run: |
          set -e

          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM

          export PATH="/opt/devkitpro/portlibs/3ds/bin:$PATH"
          export PATH="/opt/devkitpro/tools/bin:$PATH"
          export PATH="/opt/devkitpro/devkitARM/bin:$PATH"

          cd /tmp

          rm -rf /tmp/citro2d
          mkdir -p /tmp/citro2d

          wget -O citro2d.tar.gz \
            https://github.com/devkitPro/citro2d/archive/refs/tags/v1.7.0.tar.gz

          tar \
            -xzf citro2d.tar.gz \
            -C /tmp/citro2d

          CITRO2D_ROOT="/tmp/citro2d/citro2d-1.7.0"

          test -f "$CITRO2D_ROOT/CMakeLists.txt"

          echo "======================================"
          echo "Configuring citro2d with devkitPro CMake"
          echo "======================================"

          command -v arm-none-eabi-cmake

          arm-none-eabi-cmake \
            -S "$CITRO2D_ROOT" \
            -B "$CITRO2D_ROOT/build" \
            -DCMAKE_INSTALL_PREFIX=/opt/devkitpro/libctru \
            -DCMAKE_BUILD_TYPE=Release

          echo "======================================"
          echo "Building citro2d"
          echo "======================================"

          arm-none-eabi-cmake \
            --build "$CITRO2D_ROOT/build" \
            -j2

          echo "======================================"
          echo "Installing citro2d"
          echo "======================================"

          arm-none-eabi-cmake \
            --install "$CITRO2D_ROOT/build"

          echo "citro2d build/install complete."

      # ============================================================
      # VERIFY 3DS LIBRARIES
      # ============================================================

      - name: Verify 3DS libraries
        shell: bash
        run: |
          set -e

          echo "libctru:"
          find /opt/devkitpro \
            -name libctru.a \
            -print

          echo "libcitro3d:"
          find /opt/devkitpro \
            -name libcitro3d.a \
            -print

          echo "libcitro2d:"
          find /opt/devkitpro \
            -name libcitro2d.a \
            -print

          test -f \
            /opt/devkitpro/libctru/lib/libctru.a

          test -f \
            /opt/devkitpro/libctru/lib/libcitro3d.a

          test -f \
            /opt/devkitpro/libctru/lib/libcitro2d.a

          echo "======================================"
          echo "ALL 3DS LIBRARIES FOUND"
          echo "======================================"

      # ============================================================
      # PATCH HOENN REBORN MAKEFILE
      # ============================================================

      - name: Patch Hoenn Reborn Makefile
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("Makefile")

          if not p.exists():
              raise SystemExit("Makefile not found")

          text = p.read_text()

          text = text.replace(
              "mgba-static",
              "mgba"
          )

          p.write_text(text)

          print("Hoenn Reborn Makefile patched.")
          PY

      # ============================================================
      # VERIFY PROJECT
      # ============================================================

      - name: Verify project files
        shell: bash
        run: |
          set -e

          test -f Makefile
          test -f cia.rsf

          test -f source/main.c
          test -f source/dashboard.c
          test -f source/game_data.c
          test -f source/gba_core_mgba.c

          test -d romfs/hoenn_reborn

          echo "======================================"
          echo "PROJECT FILES VERIFIED"
          echo "======================================"

      # ============================================================
      # BUILD HOENN REBORN
      # ============================================================

      - name: Build Hoenn Reborn
        shell: bash
        run: |
          set -e

          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM

          export PATH="/opt/devkitpro/portlibs/3ds/bin:$PATH"
          export PATH="/opt/devkitpro/tools/bin:$PATH"
          export PATH="/opt/devkitpro/devkitARM/bin:$PATH"

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"

          arm-none-eabi-gcc --version

          echo "Starting Hoenn Reborn build..."

          make -j2

      # ============================================================
      # VERIFY CIA
      # ============================================================

      - name: Verify CIA
        shell: bash
        run: |
          set -e

          test -f Hoenn_Reborn.cia

          echo "======================================"
          echo "CIA BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh Hoenn_Reborn.cia
          wc -c Hoenn_Reborn.cia

      # ============================================================
      # VERIFY 3DSX
      # ============================================================

      - name: Verify 3DSX
        shell: bash
        run: |
          set -e

          test -f Hoenn_Reborn.3dsx

          echo "======================================"
          echo "3DSX BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh Hoenn_Reborn.3dsx
          wc -c Hoenn_Reborn.3dsx

      # ============================================================
      # VERIFY ELF
      # ============================================================

      - name: Verify ELF
        shell: bash
        run: |
          set -e

          test -f Hoenn_Reborn.elf

          echo "======================================"
          echo "ELF BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh Hoenn_Reborn.elf
          wc -c Hoenn_Reborn.elf

      # ============================================================
      # UPLOAD CIA
      # ============================================================

      - name: Upload CIA
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-CIA
          path: Hoenn_Reborn.cia
          if-no-files-found: error

      # ============================================================
      # UPLOAD 3DSX
      # ============================================================

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-3DSX
          path: Hoenn_Reborn.3dsx
          if-no-files-found: error

      # ============================================================
      # UPLOAD ELF
      # ============================================================

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-ELF
          path: Hoenn_Reborn.elf
          if-no-files-found: error

      # ============================================================
      # UPLOAD BUILD FILES
      # ============================================================

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-Build-Files
          path: |
            Hoenn_Reborn.cia
            Hoenn_Reborn.3dsx
            Hoenn_Reborn.elf
            Hoenn_Reborn.smdh
            Hoenn_Reborn.bnr
          if-no-files-found: warn
