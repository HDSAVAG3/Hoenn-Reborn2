name: Build Hoenn Reborn 3DS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize devkitPro environment
        run: |
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"

          echo "$DEVKITARM/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPRO/tools/bin" >> "$GITHUB_PATH"

          echo "===== GCC ====="
          "$DEVKITARM/bin/arm-none-eabi-gcc" --version

          echo "===== 3DS TOOLS ====="
          command -v makerom || true
          command -v bannertool || true
          command -v 3dsxtool || true
          command -v tex3ds || true

      - name: Verify devkitPro environment
        run: |
          echo "===== ENVIRONMENT ====="

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"

          echo "===== GCC ====="

          command -v arm-none-eabi-gcc
          arm-none-eabi-gcc --version

          echo "===== G++ ====="

          command -v arm-none-eabi-g++
          arm-none-eabi-g++ --version

          echo "===== AR ====="

          command -v arm-none-eabi-ar

          echo "===== 3DS TOOLS ====="

          command -v makerom || true
          command -v bannertool || true
          command -v 3dsxtool || true
          command -v tex3ds || true

      - name: Extract Hoenn Reborn project
        run: |
          rm -rf project
          mkdir -p project

          unzip -o Hoenn_Reborn_GitHub_Build.zip -d project

          echo "===== PROJECT CONTENTS ====="

          find project \
            -maxdepth 3 \
            -type f \
            | sort

      - name: Download mGBA 0.10.5
        run: |
          rm -rf mgba

          git clone \
            --depth 1 \
            --branch 0.10.5 \
            https://github.com/mgba-emu/mgba.git \
            mgba

          echo "===== mGBA 3DS TOOLCHAIN ====="

          test -f \
            mgba/src/platform/3ds/CMakeToolchain.txt

          ls -lh \
            mgba/src/platform/3ds/CMakeToolchain.txt

      - name: Configure mGBA
        run: |
          rm -rf mgba/build

          mkdir -p mgba/build

          cd mgba/build

          cmake \
            -DCMAKE_TOOLCHAIN_FILE=../src/platform/3ds/CMakeToolchain.txt \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBMGBA_ONLY=ON \
            -DBUILD_STATIC=ON \
            -DBUILD_SHARED=OFF \
            -DSKIP_LIBRARY=OFF \
            -DM_CORE_GBA=ON \
            -DM_CORE_GB=OFF \
            -DDISABLE_DEPS=ON \
            -DUSE_PNG=OFF \
            -DUSE_ZLIB=OFF \
            -DENABLE_SCRIPTING=OFF \
            -DBUILD_TEST=OFF \
            -DBUILD_SUITE=OFF \
            -DBUILD_EXAMPLE=OFF \
            -DBUILD_PERF=OFF \
            ..

          echo "===== CMAKE CONFIGURATION COMPLETE ====="

          test -f Makefile

      - name: Build mGBA
        run: |
          cmake \
            --build mgba/build \
            --target mgba \
            --parallel 2

      - name: Find mGBA library
        run: |
          echo "===== ALL STATIC LIBRARIES ====="

          find mgba/build \
            -type f \
            -name "*.a" \
            -print

          echo "===== SEARCHING FOR LIBMGBA ====="

          LIB=$(find mgba/build \
            -type f \
            -name "libmgba.a" \
            | head -n 1)

          if [ -z "$LIB" ]; then
            echo "ERROR: libmgba.a was not produced."
            exit 1
          fi

          echo "FOUND:"
          echo "$LIB"

          mkdir -p project/mgba/build-hoenn-3ds

          cp "$LIB" \
            project/mgba/build-hoenn-3ds/libmgba-static.a

          echo "===== STAGED LIBRARY ====="

          ls -lh \
            project/mgba/build-hoenn-3ds/libmgba-static.a

          test -s \
            project/mgba/build-hoenn-3ds/libmgba-static.a

      - name: Copy mGBA headers
        run: |
          mkdir -p project/mgba/include
          mkdir -p project/mgba/build-hoenn-3ds/include

          echo "===== COPYING PUBLIC HEADERS ====="

          if [ -d mgba/include ]; then
            cp -R \
              mgba/include/. \
              project/mgba/include/
          fi

          echo "===== COPYING GENERATED HEADERS ====="

          if [ -d mgba/build/include ]; then
            cp -R \
              mgba/build/include/. \
              project/mgba/build-hoenn-3ds/include/
          fi

          echo "===== PUBLIC HEADERS ====="

          find project/mgba/include \
            -type f \
            | head -50

      - name: Verify mGBA staging
        run: |
          echo "======================================"
          echo "        MGBA STAGING CHECK"
          echo "======================================"

          test -s \
            project/mgba/build-hoenn-3ds/libmgba-static.a

          test -d \
            project/mgba/include

          echo "Library:"

          ls -lh \
            project/mgba/build-hoenn-3ds/libmgba-static.a

          echo "Library size:"

          wc -c \
            project/mgba/build-hoenn-3ds/libmgba-static.a

          echo "mGBA staging verified successfully."

      - name: Disable broken bundled mGBA build rule
        working-directory: project
        run: |
          echo "===== PATCHING PROJECT MAKEFILE ====="

          python3 <<'PY'
          from pathlib import Path

          p = Path("Makefile")
          text = p.read_text()

          old = """mgba-core:
          \t@mkdir -p "$(MGBA_BUILD)"
          \tcmake -S "$(MGBA_DIR)" -B "$(MGBA_BUILD)" \\
          \t\t-DCMAKE_TOOLCHAIN_FILE="$(MGBA_DIR)/src/platform/3ds/CMakeToolchain.txt" \\
          \t\t-D3DS=ON -DLIBMGBA_ONLY=ON -DBUILD_STATIC=ON -DBUILD_SHARED=OFF \\
          \t\t-DM_CORE_GBA=ON -DM_CORE_GB=OFF -DDISABLE_DEPS=ON -DBUILD_LTO=OFF
          \tcmake --build "$(MGBA_BUILD)" --target mgba-static -j
          """

          if old in text:
              text = text.replace(
                  old,
                  """mgba-core:
          \t@echo "mGBA was prebuilt by GitHub Actions."
          \t@test -f "$(MGBA_LIB)"
          """
              )
          else:
              print("Original mgba-core block was not found.")
              print("Continuing because the staged library will be verified separately.")

          p.write_text(text)
          PY

          echo "===== RESULTING MGBA RULE ====="

          grep -A8 -B2 "^mgba-core:" Makefile || true

      - name: Verify Hoenn Reborn mGBA library
        working-directory: project
        run: |
          echo "===== FINAL LIBRARY CHECK ====="

          test -s \
            mgba/build-hoenn-3ds/libmgba-static.a

          ls -lh \
            mgba/build-hoenn-3ds/libmgba-static.a

      - name: Build Hoenn Reborn
        working-directory: project
        run: |
          echo "======================================"
          echo "        BUILDING HOENN REBORN"
          echo "======================================"

          make clean || true

          test -s \
            mgba/build-hoenn-3ds/libmgba-static.a

          make -j2

      - name: Check build outputs
        run: |
          echo "======================================"
          echo "        BUILD OUTPUTS"
          echo "======================================"

          find project \
            -type f \
            \( \
              -name "*.cia" \
              -o \
              -name "*.3dsx" \
              -o \
              -name "*.elf" \
            \) \
            -print

      - name: Verify CIA
        run: |
          CIA=$(find project \
            -type f \
            -name "*.cia" \
            | head -n 1)

          if [ -z "$CIA" ]; then
            echo "ERROR: No CIA was created."
            exit 1
          fi

          echo "======================================"
          echo "        CIA SUCCESSFULLY CREATED"
          echo "======================================"

          ls -lh "$CIA"

      - name: Upload CIA
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-CIA
          path: project/**/*.cia
          if-no-files-found: error

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-3DSX
          path: project/**/*.3dsx
          if-no-files-found: warn

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-ELF
          path: project/**/*.elf
          if-no-files-found: warn

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-build-logs
          path: |
            mgba/build/CMakeCache.txt
            mgba/build/CMakeFiles/**
            project/mgba/**
