name: Build Hoenn Reborn

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Hoenn Reborn
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. SET UP DEVKITPRO
      # ============================================================
      - name: Initialize devkitPro environment
        shell: bash
        run: |
          set -eux

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"

          echo "$DEVKITARM/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPRO/tools/bin" >> "$GITHUB_PATH"

          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          arm-none-eabi-gcc --version
          make --version
          cmake --version

      # ============================================================
      # 3. INSTALL SYSTEM PACKAGES
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          apt-get update

          apt-get install -y \
            zstd \
            unzip \
            wget \
            curl \
            git \
            build-essential \
            pkg-config \
            libpng-dev \
            zlib1g-dev \
            libfreetype6-dev

      # ============================================================
      # 4. LOCATE PROJECT
      # ============================================================
      - name: Locate Hoenn Reborn project
        shell: bash
        run: |
          set -eux

          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort | head -300

          mkdir -p /tmp/hoenn_extract

          ZIP_FILE=""

          for f in ./*.zip; do
            if [ -f "$f" ]; then
              ZIP_FILE="$f"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found."
            exit 1
          fi

          echo "Using project ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d /tmp/hoenn_extract

          echo "Extracted files:"
          find /tmp/hoenn_extract -maxdepth 5 -type f | sort | head -300

          MAKEFILE_PATH=$(find /tmp/hoenn_extract -type f -name Makefile | head -1)

          if [ -z "$MAKEFILE_PATH" ]; then
            echo "Could not find Makefile."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$MAKEFILE_PATH")

          echo "Project root:"
          echo "$PROJECT_ROOT"

          rm -rf project
          mkdir -p project

          cp -a "$PROJECT_ROOT"/. project/

          echo "Final project:"
          find project -maxdepth 4 -type f | sort | head -300

          test -f project/Makefile
          test -f project/source/main.c
          test -f project/source/dashboard.c
          test -f project/source/game_data.c
          test -f project/source/gba_core_mgba.c

      # ============================================================
      # 5. BUILD BANNERTOOL FROM SOURCE
      # ============================================================
      - name: Build bannertool
        shell: bash
        run: |
          set -eux

          rm -rf /tmp/bannertool

          git clone --depth 1 \
            --branch v1.2.2 \
            https://github.com/Epicpkmn11/bannertool.git \
            /tmp/bannertool

          cd /tmp/bannertool

          echo "bannertool source:"
          find . -maxdepth 3 -type f | sort | head -200

          if [ -f Makefile ]; then
            make -j2
          elif [ -f CMakeLists.txt ]; then
            cmake -S . -B build
            cmake --build build -j2
          else
            echo "Unable to determine bannertool build system."
            exit 1
          fi

          BANNERTOOL_BIN=$(find . -type f -name bannertool -perm -111 | head -1)

          if [ -z "$BANNERTOOL_BIN" ]; then
            echo "bannertool executable was not produced."
            exit 1
          fi

          mkdir -p /opt/hoenn-tools
          cp "$BANNERTOOL_BIN" /opt/hoenn-tools/bannertool
          chmod +x /opt/hoenn-tools/bannertool

          /opt/hoenn-tools/bannertool --help

          echo "/opt/hoenn-tools" >> "$GITHUB_PATH"

      # ============================================================
      # 6. INSTALL 3DS PACKAGING TOOLS
      # ============================================================
      - name: Install 3DS packaging tools
        shell: bash
        run: |
          set -eux

          mkdir -p /opt/hoenn-tools

          # --------------------------------------------------------
          # makerom
          # --------------------------------------------------------
          cd /tmp

          wget -O makerom.zip \
            https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip

          rm -rf makerom_extract
          mkdir makerom_extract

          unzip -q makerom.zip -d makerom_extract

          MAKEROM_BIN=$(find makerom_extract -type f -name makerom | head -1)

          if [ -z "$MAKEROM_BIN" ]; then
            echo "makerom executable not found."
            find makerom_extract -type f -maxdepth 4
            exit 1
          fi

          cp "$MAKEROM_BIN" /opt/hoenn-tools/makerom
          chmod +x /opt/hoenn-tools/makerom

          # --------------------------------------------------------
          # 3dstools
          # --------------------------------------------------------
          wget -O 3dstools.pkg.tar.zst \
            https://wii.leseratte10.de/devkitPro/other-stuff/3dstools/3dstools-1.3.1-3-linux_x86_64.pkg.tar.zst

          rm -rf 3dstools_extract
          mkdir 3dstools_extract

          tar --zstd -xf 3dstools.pkg.tar.zst -C 3dstools_extract

          find 3dstools_extract -type f | sort

          THREE_DS_XTOOL=$(find 3dstools_extract -type f -name 3dsxtool | head -1)
          SMDH_TOOL=$(find 3dstools_extract -type f -name smdhtool | head -1)

          if [ -z "$THREE_DS_XTOOL" ]; then
            echo "3dsxtool not found."
            exit 1
          fi

          if [ -z "$SMDH_TOOL" ]; then
            echo "smdhtool not found."
            exit 1
          fi

          cp "$THREE_DS_XTOOL" /opt/hoenn-tools/3dsxtool
          cp "$SMDH_TOOL" /opt/hoenn-tools/smdhtool

          chmod +x \
            /opt/hoenn-tools/3dsxtool \
            /opt/hoenn-tools/smdhtool

          # --------------------------------------------------------
          # tex3ds
          # --------------------------------------------------------
          wget -O tex3ds.pkg.tar.zst \
            https://wii.leseratte10.de/devkitPro/other-stuff/tex3ds/tex3ds-2.3.0-4-linux_x86_64.pkg.tar.zst

          rm -rf tex3ds_extract
          mkdir tex3ds_extract

          tar --zstd -xf tex3ds.pkg.tar.zst -C tex3ds_extract

          TEX3DS_BIN=$(find tex3ds_extract -type f -name tex3ds | head -1)

          if [ -z "$TEX3DS_BIN" ]; then
            echo "tex3ds not found."
            exit 1
          fi

          cp "$TEX3DS_BIN" /opt/hoenn-tools/tex3ds
          chmod +x /opt/hoenn-tools/tex3ds

          # --------------------------------------------------------
          # Verify
          # --------------------------------------------------------
          export PATH="/opt/hoenn-tools:$PATH"

          echo "===== TOOL VERIFICATION ====="

          bannertool --help
          makerom --help
          3dsxtool --help
          smdhtool --help
          tex3ds --help

          echo "===== TOOLS OK ====="

      # ============================================================
      # 7. GET REAL mGBA SOURCE
      # ============================================================
      - name: Get mGBA source
        shell: bash
        run: |
          set -eux

          rm -rf mgba

          git clone \
            --depth 1 \
            --branch 0.10.5 \
            https://github.com/mgba-emu/mgba.git \
            mgba

          echo "mGBA root:"
          ls -la mgba

          echo "Checking CMakeLists:"
          test -f mgba/CMakeLists.txt

          echo "mGBA CMakeLists found."

          find mgba/src/platform/3ds -maxdepth 2 -type f | sort

      # ============================================================
      # 8. BUILD mGBA STATIC LIBRARY
      # ============================================================
      - name: Build mGBA static library
        shell: bash
        run: |
          set -eux

          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:/opt/hoenn-tools:$PATH"

          rm -rf mgba/build-hoenn-3ds

          cmake \
            -S mgba \
            -B mgba/build-hoenn-3ds \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/mgba/src/platform/3ds/CMakeToolchain.txt" \
            -D3DS=ON \
            -DLIBMGBA_ONLY=ON \
            -DBUILD_STATIC=ON \
            -DBUILD_SHARED=OFF \
            -DM_CORE_GBA=ON \
            -DM_CORE_GB=OFF \
            -DDISABLE_DEPS=ON \
            -DBUILD_LTO=OFF

          cmake \
            --build mgba/build-hoenn-3ds \
            --target mgba \
            -j2

          echo "Searching for libmgba.a..."

          find mgba/build-hoenn-3ds \
            -type f \
            \( -name "libmgba.a" -o -name "libmgba-static.a" \) \
            -print

          MGBA_LIB=$(find mgba/build-hoenn-3ds \
            -type f \
            -name "libmgba.a" | head -1)

          if [ -z "$MGBA_LIB" ]; then
            echo "libmgba.a was not produced."
            exit 1
          fi

          echo "Found:"
          echo "$MGBA_LIB"

          mkdir -p project/mgba/build-hoenn-3ds
          mkdir -p project/mgba/include
          mkdir -p project/mgba/src

          cp "$MGBA_LIB" \
            project/mgba/build-hoenn-3ds/libmgba-static.a

          cp -a mgba/include/. \
            project/mgba/include/

          cp -a mgba/src/. \
            project/mgba/src/

          echo "mGBA staged into project."

          ls -lh \
            project/mgba/build-hoenn-3ds/libmgba-static.a

      # ============================================================
      # 9. PATCH MAKEFILE SO mGBA IS NOT REBUILT
      # ============================================================
      - name: Prepare Hoenn Reborn Makefile
        shell: bash
        run: |
          set -eux

          cd project

          echo "Original mgba-core section:"
          sed -n '1,100p' Makefile

          python3 - <<'PY'
          from pathlib import Path

          p = Path("Makefile")
          s = p.read_text()

          start = s.find("mgba-core:")

          if start != -1:
              end = s.find("\n3dsx:", start)

              if end == -1:
                  end = s.find("\n$(TARGET).elf:", start)

              if end == -1:
                  raise SystemExit("Could not find end of mgba-core section")

              replacement = """mgba-core:
          @test -f "$(MGBA_LIB)"
          @echo "Using prebuilt mGBA: $(MGBA_LIB)"

          """

              s = s[:start] + replacement + s[end + 1:]

          p.write_text(s)
          PY

          echo "Patched Makefile:"
          sed -n '1,100p' Makefile

          test -f mgba/build-hoenn-3ds/libmgba-static.a

      # ============================================================
      # 10. BUILD
      # ============================================================
      - name: Build Hoenn Reborn
        shell: bash
        run: |
          set -eux

          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:/opt/hoenn-tools:$PATH"

          cd project

          echo "========================================"
          echo "VERIFY TOOLS"
          echo "========================================"

          command -v bannertool
          command -v makerom
          command -v 3dsxtool
          command -v smdhtool
          command -v tex3ds

          echo "========================================"
          echo "VERIFY mGBA"
          echo "========================================"

          ls -lh mgba/build-hoenn-3ds/libmgba-static.a

          echo "========================================"
          echo "BUILDING HOENN REBORN"
          echo "========================================"

          make -j2

          echo "========================================"
          echo "BUILD COMPLETE"
          echo "========================================"

          ls -lh \
            Hoenn_Reborn.cia \
            Hoenn_Reborn.3dsx \
            Hoenn_Reborn.elf \
            Hoenn_Reborn.smdh \
            Hoenn_Reborn.bnr

      # ============================================================
      # 11. VERIFY CIA
      # ============================================================
      - name: Verify CIA
        shell: bash
        run: |
          set -eux

          cd project

          test -f Hoenn_Reborn.cia
          test -s Hoenn_Reborn.cia

          echo "CIA size:"
          wc -c Hoenn_Reborn.cia

      # ============================================================
      # 12. VERIFY 3DSX
      # ============================================================
      - name: Verify 3DSX
        shell: bash
        run: |
          set -eux

          cd project

          test -f Hoenn_Reborn.3dsx
          test -s Hoenn_Reborn.3dsx

          echo "3DSX size:"
          wc -c Hoenn_Reborn.3dsx

      # ============================================================
      # 13. UPLOAD CIA
      # ============================================================
      - name: Upload CIA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-CIA
          path: project/Hoenn_Reborn.cia
          if-no-files-found: error

      # ============================================================
      # 14. UPLOAD 3DSX
      # ============================================================
      - name: Upload 3DSX
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-3DSX
          path: project/Hoenn_Reborn.3dsx
          if-no-files-found: error

      # ============================================================
      # 15. UPLOAD ELF
      # ============================================================
      - name: Upload ELF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-ELF
          path: project/Hoenn_Reborn.elf
          if-no-files-found: error

      # ============================================================
      # 16. UPLOAD BUILD LOGS
      # ============================================================
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-Build-Logs
          path: |
            project/
            mgba/
          retention-days: 7
