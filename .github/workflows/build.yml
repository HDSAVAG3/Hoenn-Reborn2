name: Build Hoenn Reborn

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CIA
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host tools
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            wget \
            curl \
            git \
            cmake \
            make \
            python3 \
            unzip \
            xz-utils \
            zstd \
            p7zip-full

      - name: Prepare project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CHECKING PROJECT"
          echo "========================================"

          if [ -f "Makefile" ]; then
            echo "Makefile found."

          elif [ -f "Hoenn_Reborn_GitHub_Build.zip" ]; then
            echo "Project ZIP found."

            unzip -o "Hoenn_Reborn_GitHub_Build.zip"

            if [ -f "Hoenn_Reborn_GitHub_Build/Makefile" ]; then
              cp -a Hoenn_Reborn_GitHub_Build/. .
            fi
          fi

          if [ ! -f "Makefile" ]; then
            echo "ERROR: Makefile not found."

            find . \
              -maxdepth 3 \
              -type f \
              | sort \
              | head -200

            exit 1
          fi

          echo "Project ready."

      - name: Create Docker build script
        shell: bash
        run: |
          set -e

          cat > build-inside.sh <<'BUILD_SCRIPT'
          #!/usr/bin/env bash

          set -e

          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM

          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          echo "========================================"
          echo "INSIDE DEVKITARM CONTAINER"
          echo "========================================"

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"

          echo "========================================"
          echo "CHECKING DEVKITARM"
          echo "========================================"

          "$DEVKITARM/bin/arm-none-eabi-gcc" --version

          echo "========================================"
          echo "INSTALLING HOST BUILD DEPENDENCIES"
          echo "========================================"

          apt-get update

          apt-get install -y \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libfreetype6-dev \
            libmagick++-dev \
            libfftw3-dev \
            gcc \
            g++ \
            make \
            git \
            wget \
            curl \
            unzip

          echo "Host build dependencies installed."

          echo "========================================"
          echo "BUILDING BANNERS TOOL"
          echo "========================================"

          cd /tmp

          rm -rf bannertool

          echo "Cloning bannertool..."

          git clone \
            --depth 1 \
            https://github.com/Epicpkmn11/bannertool.git \
            bannertool

          cd bannertool

          echo "Configuring buildtools submodule..."

          git config \
            submodule.buildtools.url \
            https://github.com/Steveice10/buildtools.git

          echo "Initializing buildtools..."

          git submodule update \
            --init \
            --depth 1

          echo "Bannertool source prepared."

          echo "Building bannertool..."

          make -j2

          BANNERTOOL="/tmp/bannertool/output/linux-x86_64/bannertool"

          if [ ! -f "$BANNERTOOL" ]; then
            echo "ERROR: Native bannertool build did not produce:"
            echo "$BANNERTOOL"

            find /tmp/bannertool \
              -maxdepth 6 \
              -type f \
              -name "bannertool" \
              -print

            exit 1
          fi

          chmod +x "$BANNERTOOL"

          cp "$BANNERTOOL" \
            "$DEVKITPRO/tools/bin/bannertool"

          echo "Native bannertool installed."

          ls -lh \
            "$DEVKITPRO/tools/bin/bannertool"

          echo "Testing bannertool..."

          bannertool --help || true

          echo "========================================"
          echo "INSTALLING MAKEROM"
          echo "========================================"

          mkdir -p /tmp/tools

          cd /tmp/tools

          wget -q \
            https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip \
            -O makerom.zip

          echo "makerom downloaded."

          ls -lh makerom.zip

          rm -rf makerom-extracted

          mkdir -p makerom-extracted

          unzip -o \
            makerom.zip \
            -d makerom-extracted

          MAKEROM=$(find /tmp/tools/makerom-extracted \
            -type f \
            -name makerom \
            | head -1)

          if [ -z "$MAKEROM" ]; then
            echo "ERROR: makerom executable not found."

            find /tmp/tools/makerom-extracted \
              -maxdepth 5 \
              -type f \
              -print

            exit 1
          fi

          chmod +x "$MAKEROM"

          cp "$MAKEROM" \
            "$DEVKITPRO/tools/bin/makerom"

          echo "makerom installed."

          ls -lh \
            "$DEVKITPRO/tools/bin/makerom"

          echo "Testing makerom..."

          makerom -h || true

          echo "========================================"
          echo "BUILDING TEX3DS"
          echo "========================================"

          cd /tmp/tools

          rm -rf tex3ds

          echo "Cloning tex3ds v2.3.0..."

          git clone \
            --depth 1 \
            --branch v2.3.0 \
            https://github.com/devkitPro/tex3ds.git \
            tex3ds

          cd tex3ds

          echo "Generating tex3ds configure files..."

          ./autogen.sh

          echo "Configuring tex3ds..."

          ./configure \
            --prefix="$DEVKITPRO/tools"

          echo "Building tex3ds..."

          make -j2

          echo "Installing tex3ds..."

          make install

          export PATH="$DEVKITPRO/tools/bin:$PATH"

          echo "tex3ds installed:"

          command -v tex3ds

          tex3ds --version || true

          echo "========================================"
          echo "BUILDING LIBCTRU"
          echo "========================================"

          cd /tmp

          rm -rf libctru-2.7.0

          wget -q \
            https://github.com/devkitPro/libctru/archive/refs/tags/v2.7.0.tar.gz \
            -O libctru.tar.gz

          tar -xzf libctru.tar.gz

          cd libctru-2.7.0/libctru

          echo "Patching libctru gdbMode warning..."

          sed -i \
            's/gdbhio_mode_t gdbMode = 0;/gdbhio_mode_t gdbMode __attribute__((unused)) = 0;/' \
            source/gdbhio.c

          echo "Building libctru..."

          make -j2

          echo "Installing libctru..."

          make install

          echo "libctru complete."

          echo "========================================"
          echo "BUILDING CITRO3D"
          echo "========================================"

          cd /tmp

          rm -rf citro3d-1.7.1

          wget -q \
            https://github.com/devkitPro/citro3d/archive/refs/tags/v1.7.1.tar.gz \
            -O citro3d.tar.gz

          tar -xzf citro3d.tar.gz

          cd citro3d-1.7.1

          echo "Building citro3d..."

          make -j2

          echo "Installing citro3d..."

          make install

          echo "citro3d complete."

          echo "========================================"
          echo "BUILDING CITRO2D"
          echo "========================================"

          cd /tmp

          rm -rf citro2d-1.6.0

          wget -q \
            https://github.com/devkitPro/citro2d/archive/refs/tags/v1.6.0.tar.gz \
            -O citro2d.tar.gz

          tar -xzf citro2d.tar.gz

          cd citro2d-1.6.0

          echo "Patching citro2d return types..."

          sed -i \
            's/void C2D_Fade(u32 color)/bool C2D_Fade(u32 color)/' \
            source/base.c

          sed -i \
            's/void C2D_SetTintMode(C2D_TintMode mode)/bool C2D_SetTintMode(C2D_TintMode mode)/' \
            source/base.c

          sed -i \
            's/void C2D_Fade(u32 color)/bool C2D_Fade(u32 color)/' \
            include/citro2d.h

          sed -i \
            's/void C2D_SetTintMode(C2D_TintMode mode)/bool C2D_SetTintMode(C2D_TintMode mode)/' \
            include/citro2d.h

          echo "Adding return true to C2D_Fade..."

          sed -i \
            '/ctx->fadeClr = color;/a\    return true;' \
            source/base.c

          echo "Adding return true to C2D_SetTintMode..."

          sed -i \
            '/ctx->flags = (ctx->flags \&~ C2DiF_TintMode_Mask) | (new_mode << (C2DiF_TintMode_Shift - C2DiF_Mode_Shift));/a\    return true;' \
            source/base.c

          echo "Building citro2d..."

          make -j2

          echo "Installing citro2d..."

          make install

          echo "citro2d complete."

          echo "========================================"
          echo "DOWNLOADING MGBA 0.10.5"
          echo "========================================"

          cd /work

          rm -rf mgba

          rm -f mgba.tar.gz

          wget -q \
            https://github.com/mgba-emu/mgba/archive/refs/tags/0.10.5.tar.gz \
            -O mgba.tar.gz

          tar -xzf mgba.tar.gz

          mv mgba-0.10.5 mgba

          echo "mGBA source downloaded."

          echo "========================================"
          echo "PATCHING MGBA GBA-ONLY GUI"
          echo "========================================"

          CONFIG="mgba/src/feature/gui/gui-config.c"

          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: mGBA GUI config not found."

            exit 1
          fi

          python3 - "$CONFIG" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          old = """            if (gbBiosPath[0]) {
                mCoreConfigSetValue(&runner->config, "gb.bios", gbBiosPath);
            }
            if (gbcBiosPath[0]) {
                mCoreConfigSetValue(&runner->config, "gbc.bios", gbcBiosPath);
            }
            if (sgbBiosPath[0]) {
                mCoreConfigSetValue(&runner->config, "sgb.bios", sgbBiosPath);
            }
          """

          new = """#ifdef M_CORE_GB
            if (gbBiosPath[0]) {
                mCoreConfigSetValue(&runner->config, "gb.bios", gbBiosPath);
            }
            if (gbcBiosPath[0]) {
                mCoreConfigSetValue(&runner->config, "gbc.bios", gbcBiosPath);
            }
            if (sgbBiosPath[0]) {
                mCoreConfigSetValue(&runner->config, "sgb.bios", sgbBiosPath);
            }
          #endif
          """

          if old in text:
              text = text.replace(old, new, 1)

          else:
              start = text.find("if (gbBiosPath[0])")

              if start == -1:
                  print("GB BIOS block not found.")
                  sys.exit(0)

              end_marker = 'mCoreConfigSetValue(&runner->config, "sgb.bios", sgbBiosPath);'

              end = text.find(end_marker, start)

              if end == -1:
                  print("End of GB BIOS block not found.")
                  sys.exit(1)

              end += len(end_marker)

              block = text[start:end]

              replacement = (
                  "#ifdef M_CORE_GB\n"
                  + block
                  + "\n#endif"
              )

              text = text[:start] + replacement + text[end:]

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("mGBA GUI patch applied.")
          PY

          echo "Verifying mGBA patch..."

          grep -n \
            -A15 \
            -B5 \
            "gbBiosPath" \
            "$CONFIG" \
            | head -80 || true

          echo "========================================"
          echo "CONFIGURING MGBA"
          echo "========================================"

          rm -rf mgba/build-hoenn-3ds

          cmake \
            -S mgba \
            -B mgba/build-hoenn-3ds \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITARM/3ds/CMakeToolchain.txt" \
            -D3DS=ON \
            -DLIBMGBA_ONLY=ON \
            -DBUILD_STATIC=ON \
            -DBUILD_SHARED=OFF \
            -DM_CORE_GBA=ON \
            -DM_CORE_GB=OFF \
            -DDISABLE_DEPS=ON \
            -DBUILD_LTO=OFF

          echo "========================================"
          echo "BUILDING MGBA"
          echo "========================================"

          cmake \
            --build mgba/build-hoenn-3ds \
            --target mgba \
            -j2

          echo "mGBA build complete."

          echo "Searching for libmgba.a..."

          MGBA_LIB=$(find mgba/build-hoenn-3ds \
            -name "libmgba.a" \
            -print \
            -quit)

          if [ -z "$MGBA_LIB" ]; then
            echo "ERROR: libmgba.a was not produced."

            find mgba/build-hoenn-3ds \
              -name "*.a" \
              -print

            exit 1
          fi

          echo "Found:"
          echo "$MGBA_LIB"

          mkdir -p \
            mgba/build-hoenn-3ds/lib

          cp "$MGBA_LIB" \
            mgba/build-hoenn-3ds/lib/libmgba-static.a

          echo "mGBA library created:"

          ls -lh \
            mgba/build-hoenn-3ds/lib/libmgba-static.a

          echo "========================================"
          echo "PREPARING HOENN REBORN"
          echo "========================================"

          if [ ! -f "Makefile" ]; then
            echo "ERROR: Project Makefile not found."

            exit 1
          fi

          sed -i \
            's/mgba-static/mgba/g' \
            Makefile

          echo "========================================"
          echo "PROJECT MAKEFILE"
          echo "========================================"

          sed -n '1,260p' Makefile

          echo "========================================"
          echo "BUILDING HOENN REBORN"
          echo "========================================"

          make clean || true

          make -j2

          echo "========================================"
          echo "BUILD COMPLETE"
          echo "========================================"

          find . \
            -maxdepth 6 \
            -type f \
            \( \
              -name "*.cia" \
              -o -name "*.3dsx" \
              -o -name "*.elf" \
              -o -name "*.smdh" \
              -o -name "*.bnr" \
            \) \
            -print

          echo "========================================"
          echo "END OF CONTAINER BUILD"
          echo "========================================"

          BUILD_SCRIPT

          chmod +x build-inside.sh

          echo "build-inside.sh created."

          ls -lh build-inside.sh

      - name: Run build inside devkitARM
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "STARTING DOCKER BUILD"
          echo "========================================"

          docker pull devkitpro/devkitarm:latest

          docker run \
            --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            devkitpro/devkitarm:latest \
            bash /work/build-inside.sh

      - name: Verify CIA
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SEARCHING FOR CIA"
          echo "========================================"

          find . \
            -maxdepth 6 \
            -type f \
            -name "*.cia" \
            -print

          CIA=$(find . \
            -maxdepth 6 \
            -type f \
            -name "*.cia" \
            -print \
            -quit)

          if [ -z "$CIA" ]; then
            echo "ERROR: No CIA file was produced."

            echo "Build output:"

            find . \
              -maxdepth 6 \
              -type f \
              | sort \
              | head -300

            exit 1
          fi

          echo "========================================"
          echo "CIA FOUND"
          echo "========================================"

          echo "$CIA"

          ls -lh "$CIA"

      - name: Verify 3DSX
        shell: bash
        run: |
          set -e

          THREE_DSX=$(find . \
            -maxdepth 6 \
            -type f \
            -name "*.3dsx" \
            -print \
            -quit || true)

          if [ -n "$THREE_DSX" ]; then
            echo "3DSX found:"
            ls -lh "$THREE_DSX"
          else
            echo "No 3DSX found."
          fi

      - name: Verify ELF
        shell: bash
        run: |
          set -e

          ELF=$(find . \
            -maxdepth 6 \
            -type f \
            -name "*.elf" \
            -print \
            -quit || true)

          if [ -n "$ELF" ]; then
            echo "ELF found:"
            ls -lh "$ELF"
          else
            echo "No ELF found."
          fi

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-Build
          path: |
            **/*.cia
            **/*.3dsx
            **/*.elf
          if-no-files-found: error
