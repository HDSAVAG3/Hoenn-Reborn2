name: Build Hoenn Reborn

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Hoenn Reborn
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # DEVKITPRO ENVIRONMENT
      # ============================================================
      - name: Initialize devkitPro environment
        shell: bash
        run: |
          set -eux

          echo "$DEVKITARM/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPRO/tools/bin" >> "$GITHUB_PATH"

          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"

          arm-none-eabi-gcc --version
          make --version
          cmake --version

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          apt-get update

          apt-get install -y \
            zstd \
            unzip \
            wget \
            curl \
            git \
            build-essential \
            pkg-config \
            libpng-dev \
            zlib1g-dev \
            libfreetype6-dev

      # ============================================================
      # LOCATE PROJECT ZIP
      # ============================================================
      - name: Locate Hoenn Reborn project
        shell: bash
        run: |
          set -eux

          mkdir -p /tmp/hoenn_extract

          ZIP_FILE=""

          for f in ./*.zip; do
            if [ -f "$f" ]; then
              ZIP_FILE="$f"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found."
            exit 1
          fi

          echo "Using project ZIP:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d /tmp/hoenn_extract

          MAKEFILE_PATH=$(find /tmp/hoenn_extract \
            -type f \
            -name Makefile \
            | head -1)

          if [ -z "$MAKEFILE_PATH" ]; then
            echo "Could not find Makefile."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$MAKEFILE_PATH")

          echo "Project root:"
          echo "$PROJECT_ROOT"

          rm -rf project
          mkdir -p project

          cp -a "$PROJECT_ROOT"/. project/

          test -f project/Makefile
          test -f project/source/main.c
          test -f project/source/dashboard.c
          test -f project/source/game_data.c
          test -f project/source/gba_core_mgba.c

          echo "========================================"
          echo "PROJECT READY"
          echo "========================================"

      # ============================================================
      # BANNERTOOL
      # ============================================================
      - name: Install bannertool
        shell: bash
        run: |
          set -eux

          mkdir -p /opt/hoenn-tools

          cd /tmp

          echo "========================================"
          echo "DOWNLOADING BANNERTOOL"
          echo "========================================"

          wget -O bannertool.zip \
            https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip

          rm -rf bannertool_extract
          mkdir bannertool_extract

          unzip -q \
            bannertool.zip \
            -d bannertool_extract

          echo "Bannertool files:"
          find bannertool_extract \
            -type f \
            | sort

          BANNERTOOL_BIN=$(find bannertool_extract \
            -type f \
            -path "*/linux-x86_64/bannertool" \
            | head -1)

          if [ -z "$BANNERTOOL_BIN" ]; then
            echo "64-bit bannertool was not found."

            find bannertool_extract \
              -type f \
              -name bannertool \
              | sort

            exit 1
          fi

          cp "$BANNERTOOL_BIN" \
            /opt/hoenn-tools/bannertool

          chmod +x \
            /opt/hoenn-tools/bannertool

          echo "/opt/hoenn-tools" >> "$GITHUB_PATH"

          export PATH="/opt/hoenn-tools:$PATH"

          command -v bannertool

          test -x /opt/hoenn-tools/bannertool

          echo "========================================"
          echo "BANNERTOOL OK"
          echo "========================================"

      # ============================================================
      # 3DS PACKAGING TOOLS
      # ============================================================
      - name: Install 3DS packaging tools
        shell: bash
        run: |
          set -eux

          mkdir -p /opt/hoenn-tools

          cd /tmp

          # --------------------------------------------------------
          # MAKEROM
          # --------------------------------------------------------

          echo "========================================"
          echo "INSTALLING MAKEROM"
          echo "========================================"

          wget -O makerom.zip \
            https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip

          rm -rf makerom_extract
          mkdir makerom_extract

          unzip -q \
            makerom.zip \
            -d makerom_extract

          MAKEROM_BIN=$(find makerom_extract \
            -type f \
            -name makerom \
            | head -1)

          if [ -z "$MAKEROM_BIN" ]; then
            echo "makerom executable not found."
            find makerom_extract -type f | sort
            exit 1
          fi

          cp "$MAKEROM_BIN" \
            /opt/hoenn-tools/makerom

          chmod +x \
            /opt/hoenn-tools/makerom

          # --------------------------------------------------------
          # 3DSTOOLS
          # --------------------------------------------------------

          echo "========================================"
          echo "INSTALLING 3DSTOOLS"
          echo "========================================"

          wget -O 3dstools.pkg.tar.zst \
            https://wii.leseratte10.de/devkitPro/other-stuff/3dstools/3dstools-1.3.1-3-linux_x86_64.pkg.tar.zst

          rm -rf 3dstools_extract
          mkdir 3dstools_extract

          tar \
            --zstd \
            -xf 3dstools.pkg.tar.zst \
            -C 3dstools_extract

          THREE_DS_XTOOL=$(find 3dstools_extract \
            -type f \
            -name 3dsxtool \
            | head -1)

          SMDH_TOOL=$(find 3dstools_extract \
            -type f \
            -name smdhtool \
            | head -1)

          if [ -z "$THREE_DS_XTOOL" ]; then
            echo "3dsxtool not found."
            exit 1
          fi

          if [ -z "$SMDH_TOOL" ]; then
            echo "smdhtool not found."
            exit 1
          fi

          cp "$THREE_DS_XTOOL" \
            /opt/hoenn-tools/3dsxtool

          cp "$SMDH_TOOL" \
            /opt/hoenn-tools/smdhtool

          chmod +x \
            /opt/hoenn-tools/3dsxtool \
            /opt/hoenn-tools/smdhtool

          # --------------------------------------------------------
          # TEX3DS
          # --------------------------------------------------------

          echo "========================================"
          echo "INSTALLING TEX3DS"
          echo "========================================"

          wget -O tex3ds.pkg.tar.zst \
            https://wii.leseratte10.de/devkitPro/other-stuff/tex3ds/tex3ds-2.3.0-4-linux_x86_64.pkg.tar.zst

          rm -rf tex3ds_extract
          mkdir tex3ds_extract

          tar \
            --zstd \
            -xf tex3ds.pkg.tar.zst \
            -C tex3ds_extract

          TEX3DS_BIN=$(find tex3ds_extract \
            -type f \
            -name tex3ds \
            | head -1)

          if [ -z "$TEX3DS_BIN" ]; then
            echo "tex3ds not found."
            exit 1
          fi

          cp "$TEX3DS_BIN" \
            /opt/hoenn-tools/tex3ds

          chmod +x \
            /opt/hoenn-tools/tex3ds

          export PATH="/opt/hoenn-tools:$PATH"

          echo "========================================"
          echo "VERIFYING 3DS TOOLS"
          echo "========================================"

          command -v bannertool
          command -v makerom
          command -v 3dsxtool
          command -v smdhtool
          command -v tex3ds

          echo "========================================"
          echo "3DS TOOLS READY"
          echo "========================================"

      # ============================================================
      # GET mGBA
      # ============================================================
      - name: Get mGBA source
        shell: bash
        run: |
          set -eux

          rm -rf mgba

          echo "========================================"
          echo "GETTING mGBA 0.10.5"
          echo "========================================"

          git clone \
            --depth 1 \
            --branch 0.10.5 \
            https://github.com/mgba-emu/mgba.git \
            mgba

          test -f mgba/CMakeLists.txt

          echo "mGBA SOURCE OK"

      # ============================================================
      # BUILD mGBA
      # ============================================================
      - name: Build mGBA static library
        shell: bash
        run: |
          set -eux

          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:/opt/hoenn-tools:$PATH"

          rm -rf mgba/build-hoenn-3ds

          echo "========================================"
          echo "CONFIGURING mGBA"
          echo "========================================"

          cmake \
            -S mgba \
            -B mgba/build-hoenn-3ds \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/mgba/src/platform/3ds/CMakeToolchain.txt" \
            -D3DS=ON \
            -DLIBMGBA_ONLY=ON \
            -DBUILD_STATIC=ON \
            -DBUILD_SHARED=OFF \
            -DM_CORE_GBA=ON \
            -DM_CORE_GB=OFF \
            -DDISABLE_DEPS=ON \
            -DBUILD_LTO=OFF

          echo "========================================"
          echo "BUILDING mGBA"
          echo "========================================"

          cmake \
            --build mgba/build-hoenn-3ds \
            --target mgba \
            -j2

          MGBA_LIB=$(find mgba/build-hoenn-3ds \
            -type f \
            -name "libmgba.a" \
            | head -1)

          if [ -z "$MGBA_LIB" ]; then
            echo "libmgba.a was not produced."
            exit 1
          fi

          echo "Found mGBA library:"
          echo "$MGBA_LIB"

          mkdir -p project/mgba/build-hoenn-3ds
          mkdir -p project/mgba/include
          mkdir -p project/mgba/src

          cp "$MGBA_LIB" \
            project/mgba/build-hoenn-3ds/libmgba-static.a

          cp -a \
            mgba/include/. \
            project/mgba/include/

          cp -a \
            mgba/src/. \
            project/mgba/src/

          echo "========================================"
          echo "mGBA STATIC LIBRARY READY"
          echo "========================================"

          ls -lh \
            project/mgba/build-hoenn-3ds/libmgba-static.a

      # ============================================================
      # FIX MAKEFILE
      # ============================================================
      - name: Prepare Hoenn Reborn Makefile
        shell: bash
        run: |
          set -eux

          cd project

          python3 - <<'PY'
          from pathlib import Path

          p = Path("Makefile")
          s = p.read_text()

          # --------------------------------------------------------
          # FIX 1:
          #
          # The mGBA library is inside project/mgba,
          # so the Makefile must use ./mgba rather than ../mgba.
          # --------------------------------------------------------

          s = s.replace(
              "MGBA_DIR ?= ../mgba",
              "MGBA_DIR ?= ./mgba"
          )

          # --------------------------------------------------------
          # FIX 2:
          #
          # tex3ds uses:
          #
          #     tex3ds <input> -o <output>
          #
          # NOT:
          #
          #     tex3ds -i <input> -o <output>
          #
          # because -i means an include/options file.
          # --------------------------------------------------------

          s = s.replace(
              "tex3ds -i $< -o $@",
              "tex3ds \"$<\" -o \"$@\""
          )

          # --------------------------------------------------------
          # FIX 3:
          #
          # Replace the mgba-core recipe with a prebuilt-library
          # check.
          #
          # chr(9) creates an actual Make TAB.
          # --------------------------------------------------------

          start = s.find("mgba-core:")

          if start == -1:
              raise SystemExit("Could not find mgba-core target")

          rest = s[start + len("mgba-core:"):]

          next_target = None

          for marker in [
              "\n3dsx:",
              "\n$(TARGET).elf:",
              "\ncia:",
              "\nclean:"
          ]:
              pos = rest.find(marker)

              if pos != -1:
                  if next_target is None or pos < next_target:
                      next_target = pos

          if next_target is None:
              raise SystemExit(
                  "Could not find next Makefile target"
              )

          end = start + len("mgba-core:") + next_target

          TAB = chr(9)

          replacement = (
              "mgba-core:\n"
              + TAB + '@test -f "$(MGBA_LIB)"\n'
              + TAB + '@echo "Using prebuilt mGBA: $(MGBA_LIB)"\n'
              + "\n"
          )

          s = s[:start] + replacement + s[end:]

          p.write_text(s)

          print("========================================")
          print("MAKEFILE PATCHED")
          print("========================================")
          print("MGBA_DIR = ./mgba")
          print("tex3ds input syntax fixed")
          print("mgba-core uses real TAB characters")
          PY

          echo "========================================"
          echo "CHECKING MAKEFILE"
          echo "========================================"

          grep -n \
            -E \
            "MGBA_DIR|MGBA_BUILD|MGBA_LIB|tex3ds|mgba-core" \
            Makefile

          echo "========================================"
          echo "TESTING mGBA PATH"
          echo "========================================"

          test -f \
            mgba/build-hoenn-3ds/libmgba-static.a

          echo "mGBA library found."

          echo "========================================"
          echo "TESTING MAKEFILE SYNTAX"
          echo "========================================"

          make -n mgba-core

          echo "Makefile test passed."

      # ============================================================
      # BUILD HOENN REBORN
      # ============================================================
      - name: Build Hoenn Reborn
        shell: bash
        run: |
          set -eux

          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:/opt/hoenn-tools:$PATH"

          cd project

          echo "========================================"
          echo "BUILDING HOENN REBORN"
          echo "========================================"

          make -j2

          echo "========================================"
          echo "BUILD COMPLETE"
          echo "========================================"

          ls -lh \
            Hoenn_Reborn.cia \
            Hoenn_Reborn.3dsx \
            Hoenn_Reborn.elf \
            Hoenn_Reborn.smdh \
            Hoenn_Reborn.bnr

      # ============================================================
      # VERIFY CIA
      # ============================================================
      - name: Verify CIA
        shell: bash
        run: |
          set -eux

          cd project

          test -f Hoenn_Reborn.cia
          test -s Hoenn_Reborn.cia

          echo "========================================"
          echo "CIA CREATED"
          echo "========================================"

          wc -c Hoenn_Reborn.cia

      # ============================================================
      # VERIFY 3DSX
      # ============================================================
      - name: Verify 3DSX
        shell: bash
        run: |
          set -eux

          cd project

          test -f Hoenn_Reborn.3dsx
          test -s Hoenn_Reborn.3dsx

          echo "========================================"
          echo "3DSX CREATED"
          echo "========================================"

          wc -c Hoenn_Reborn.3dsx

      # ============================================================
      # UPLOAD CIA
      # ============================================================
      - name: Upload CIA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-CIA
          path: project/Hoenn_Reborn.cia
          if-no-files-found: error

      # ============================================================
      # UPLOAD 3DSX
      # ============================================================
      - name: Upload 3DSX
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-3DSX
          path: project/Hoenn_Reborn.3dsx
          if-no-files-found: error

      # ============================================================
      # UPLOAD ELF
      # ============================================================
      - name: Upload ELF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-ELF
          path: project/Hoenn_Reborn.elf
          if-no-files-found: error

      # ============================================================
      # BUILD LOGS
      # ============================================================
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-Build-Logs
          path: |
            project/
            mgba/
          retention-days: 7
