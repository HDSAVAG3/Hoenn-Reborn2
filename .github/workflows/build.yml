name: Build Hoenn Reborn 3DS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # DEVKITPRO ENVIRONMENT
      # ============================================================

      - name: Initialize devkitPro environment
        run: |
          echo "$DEVKITARM/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPRO/tools/bin" >> "$GITHUB_PATH"

          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"

          "$DEVKITARM/bin/arm-none-eabi-gcc" --version


      - name: Verify devkitPro environment
        run: |
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          command -v arm-none-eabi-gcc
          command -v make
          command -v cmake
          command -v git
          command -v python3


      # ============================================================
      # PROJECT
      # ============================================================

      - name: Verify Hoenn Reborn project
        run: |
          echo "Repository contents:"
          ls -la

          test -d project
          test -f project/Makefile
          test -f project/source/main.c

          echo "Project found successfully."


      # ============================================================
      # INSTALL 3DS PACKAGING TOOLS
      #
      # We use fixed Linux downloads instead of trying to guess
      # GitHub release asset names.
      # ============================================================

      - name: Install 3DS packaging tools
        run: |
          set -e

          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          mkdir -p /tmp/3ds-tools
          mkdir -p "$DEVKITPRO/tools/bin"

          cd /tmp/3ds-tools

          echo "=========================================="
          echo "Downloading bannertool"
          echo "=========================================="

          wget -O bannertool.zip \
            "https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip"

          unzip -o bannertool.zip

          test -f linux-x86_64/bannertool

          cp linux-x86_64/bannertool \
            "$DEVKITPRO/tools/bin/bannertool"

          chmod +x "$DEVKITPRO/tools/bin/bannertool"


          echo "=========================================="
          echo "Downloading makerom"
          echo "=========================================="

          wget -O makerom.zip \
            "https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip"

          unzip -o makerom.zip

          test -f makerom

          cp makerom \
            "$DEVKITPRO/tools/bin/makerom"

          chmod +x "$DEVKITPRO/tools/bin/makerom"


          echo "=========================================="
          echo "Downloading 3dstools"
          echo "=========================================="

          wget -O 3dstools.pkg.tar.zst \
            "https://wii.leseratte10.de/devkitPro/other-stuff/3dstools/3dstools-1.3.1-3-linux_x86_64.pkg.tar.zst"

          mkdir -p /tmp/3dstools-package

          tar --zstd \
            -xf 3dstools.pkg.tar.zst \
            -C /tmp/3dstools-package

          echo "3dstools package contents:"
          find /tmp/3dstools-package -type f -maxdepth 8 -print


          echo "=========================================="
          echo "Installing 3dstools binaries"
          echo "=========================================="

          FOUND_3DSXTOOL=$(find /tmp/3dstools-package \
            -type f \
            -name "3dsxtool" \
            | head -n 1)

          FOUND_SMDHTOOL=$(find /tmp/3dstools-package \
            -type f \
            -name "smdhtool" \
            | head -n 1)

          if [ -z "$FOUND_3DSXTOOL" ]; then
            echo "ERROR: 3dsxtool was not found."
            exit 1
          fi

          if [ -z "$FOUND_SMDHTOOL" ]; then
            echo "ERROR: smdhtool was not found."
            exit 1
          fi

          cp "$FOUND_3DSXTOOL" \
            "$DEVKITPRO/tools/bin/3dsxtool"

          cp "$FOUND_SMDHTOOL" \
            "$DEVKITPRO/tools/bin/smdhtool"

          chmod +x \
            "$DEVKITPRO/tools/bin/3dsxtool" \
            "$DEVKITPRO/tools/bin/smdhtool"


          echo "=========================================="
          echo "Downloading tex3ds"
          echo "=========================================="

          wget -O tex3ds.pkg.tar.zst \
            "https://wii.leseratte10.de/devkitPro/other-stuff/tex3ds/tex3ds-2.3.0-4-linux_x86_64.pkg.tar.zst"

          mkdir -p /tmp/tex3ds-package

          tar --zstd \
            -xf tex3ds.pkg.tar.zst \
            -C /tmp/tex3ds-package

          echo "tex3ds package contents:"
          find /tmp/tex3ds-package -type f -maxdepth 8 -print


          FOUND_TEX3DS=$(find /tmp/tex3ds-package \
            -type f \
            -name "tex3ds" \
            | head -n 1)

          if [ -z "$FOUND_TEX3DS" ]; then
            echo "ERROR: tex3ds was not found."
            exit 1
          fi

          cp "$FOUND_TEX3DS" \
            "$DEVKITPRO/tools/bin/tex3ds"

          chmod +x "$DEVKITPRO/tools/bin/tex3ds"


          echo "=========================================="
          echo "3DS TOOL INSTALLATION COMPLETE"
          echo "=========================================="

          export PATH="$DEVKITPRO/tools/bin:$DEVKITARM/bin:$PATH"

          command -v bannertool
          command -v makerom
          command -v 3dsxtool
          command -v smdhtool
          command -v tex3ds

          echo ""
          echo "bannertool:"
          bannertool --help >/dev/null || true

          echo ""
          echo "makerom:"
          makerom --version || true

          echo ""
          echo "3dsxtool:"
          3dsxtool --help >/dev/null || true

          echo ""
          echo "tex3ds:"
          tex3ds --version || true


      # ============================================================
      # DOWNLOAD mGBA
      # ============================================================

      - name: Download mGBA 0.10.5
        run: |
          set -e

          rm -rf /tmp/mgba

          git clone \
            --depth 1 \
            --branch 0.10.5 \
            https://github.com/mgba-emu/mgba.git \
            /tmp/mgba

          echo "mGBA source downloaded."

          cd /tmp/mgba

          git describe --tags --always || true


      # ============================================================
      # CONFIGURE mGBA
      # ============================================================

      - name: Configure mGBA
        run: |
          set -e

          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          mkdir -p /tmp/mgba/build-hoenn-3ds

          cmake \
            -S /tmp/mgba \
            -B /tmp/mgba/build-hoenn-3ds \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/mgba/src/platform/3ds/CMakeToolchain.txt \
            -D3DS=ON \
            -DLIBMGBA_ONLY=ON \
            -DBUILD_STATIC=ON \
            -DBUILD_SHARED=OFF \
            -DM_CORE_GBA=ON \
            -DM_CORE_GB=OFF \
            -DDISABLE_DEPS=ON \
            -DBUILD_LTO=OFF

          echo "mGBA configuration complete."


      # ============================================================
      # BUILD mGBA
      # ============================================================

      - name: Build mGBA
        run: |
          set -e

          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          cmake \
            --build /tmp/mgba/build-hoenn-3ds \
            --target mgba \
            -j2

          echo "mGBA build complete."


      # ============================================================
      # FIND mGBA LIBRARY
      # ============================================================

      - name: Find mGBA library
        run: |
          set -e

          echo "Searching for libmgba.a..."

          find /tmp/mgba \
            -type f \
            -name "libmgba.a" \
            -print

          MGBA_LIB=$(find /tmp/mgba \
            -type f \
            -name "libmgba.a" \
            | head -n 1)

          if [ -z "$MGBA_LIB" ]; then
            echo "ERROR: libmgba.a was not found."
            exit 1
          fi

          echo "Found:"
          echo "$MGBA_LIB"

          mkdir -p project/mgba/build-hoenn-3ds

          cp "$MGBA_LIB" \
            project/mgba/build-hoenn-3ds/libmgba-static.a

          ls -lh \
            project/mgba/build-hoenn-3ds/libmgba-static.a


      # ============================================================
      # COPY mGBA HEADERS
      # ============================================================

      - name: Copy mGBA headers
        run: |
          set -e

          mkdir -p project/mgba/include
          mkdir -p project/mgba/build-hoenn-3ds/include

          if [ -d /tmp/mgba/include ]; then
            cp -R /tmp/mgba/include/* \
              project/mgba/include/
          fi

          if [ -d /tmp/mgba/build-hoenn-3ds/include ]; then
            cp -R /tmp/mgba/build-hoenn-3ds/include/* \
              project/mgba/build-hoenn-3ds/include/
          fi

          echo "mGBA headers copied."

          find project/mgba/include \
            -maxdepth 3 \
            -type f \
            | head -50


      # ============================================================
      # VERIFY mGBA STAGING
      # ============================================================

      - name: Verify mGBA staging
        run: |
          set -e

          test -s project/mgba/build-hoenn-3ds/libmgba-static.a

          echo "mGBA library:"
          ls -lh \
            project/mgba/build-hoenn-3ds/libmgba-static.a

          echo ""
          echo "mGBA include directory:"
          ls -la project/mgba/include || true


      # ============================================================
      # DISABLE PROJECT'S OLD mGBA BUILD RULE
      # ============================================================

      - name: Disable bundled mGBA build rule
        working-directory: project
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("Makefile")
          text = p.read_text()

          old = """mgba-core:
          \t@mkdir -p "$(MGBA_BUILD)"
          \tcmake -S "$(MGBA_DIR)" -B "$(MGBA_BUILD)" \\
          \t\t-DCMAKE_TOOLCHAIN_FILE="$(MGBA_DIR)/src/platform/3ds/CMakeToolchain.txt" \\
          \t\t-D3DS=ON -DLIBMGBA_ONLY=ON -DBUILD_STATIC=ON -DBUILD_SHARED=OFF \\
          \t\t-DM_CORE_GBA=ON -DM_CORE_GB=OFF -DDISABLE_DEPS=ON -DBUILD_LTO=OFF
          \tcmake --build "$(MGBA_BUILD)" --target mgba-static -j
          """

          replacement = """mgba-core:
          \t@echo "mGBA was prebuilt by GitHub Actions."
          \t@test -s "$(MGBA_LIB)"
          """

          if old in text:
              text = text.replace(old, replacement)
              p.write_text(text)
              print("Old mGBA build rule replaced.")
          else:
              print("Old mGBA build rule was not found.")
              print("Checking current Makefile...")

          PY

          echo ""
          echo "Current mgba-core rule:"
          grep -A5 -B2 "^mgba-core:" Makefile || true


      # ============================================================
      # VERIFY PROJECT mGBA LIBRARY
      # ============================================================

      - name: Verify Hoenn Reborn mGBA library
        working-directory: project
        run: |
          set -e

          test -s mgba/build-hoenn-3ds/libmgba-static.a

          echo "Hoenn Reborn mGBA library verified:"
          ls -lh mgba/build-hoenn-3ds/libmgba-static.a


      # ============================================================
      # BUILD HOENN REBORN
      # ============================================================

      - name: Build Hoenn Reborn
        working-directory: project
        run: |
          set -e

          export PATH="$DEVKITPRO/tools/bin:$DEVKITARM/bin:$PATH"

          echo "=========================================="
          echo "VERIFYING BUILD TOOLS"
          echo "=========================================="

          command -v arm-none-eabi-gcc
          command -v bannertool
          command -v makerom
          command -v 3dsxtool
          command -v tex3ds

          echo ""
          echo "=========================================="
          echo "CLEAN BUILD"
          echo "=========================================="

          make clean || true

          echo ""
          echo "=========================================="
          echo "VERIFY mGBA AFTER CLEAN"
          echo "=========================================="

          test -s mgba/build-hoenn-3ds/libmgba-static.a

          ls -lh mgba/build-hoenn-3ds/libmgba-static.a

          echo ""
          echo "=========================================="
          echo "BUILDING HOENN REBORN"
          echo "=========================================="

          make -j2


      # ============================================================
      # CHECK OUTPUTS
      # ============================================================

      - name: Check build outputs
        working-directory: project
        run: |
          set -e

          echo "=========================================="
          echo "BUILD OUTPUTS"
          echo "=========================================="

          ls -lh Hoenn_Reborn.elf
          ls -lh Hoenn_Reborn.3dsx
          ls -lh Hoenn_Reborn.cia

          echo ""
          echo "File sizes:"

          wc -c \
            Hoenn_Reborn.elf \
            Hoenn_Reborn.3dsx \
            Hoenn_Reborn.cia


      # ============================================================
      # VERIFY CIA
      # ============================================================

      - name: Verify CIA
        working-directory: project
        run: |
          set -e

          test -s Hoenn_Reborn.cia

          echo "CIA successfully created."

          ls -lh Hoenn_Reborn.cia


      # ============================================================
      # UPLOAD CIA
      # ============================================================

      - name: Upload CIA
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-CIA
          path: project/Hoenn_Reborn.cia
          if-no-files-found: error


      # ============================================================
      # UPLOAD 3DSX
      # ============================================================

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-3DSX
          path: project/Hoenn_Reborn.3dsx
          if-no-files-found: error


      # ============================================================
      # UPLOAD ELF
      # ============================================================

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-ELF
          path: project/Hoenn_Reborn.elf
          if-no-files-found: error


      # ============================================================
      # UPLOAD BUILD LOGS
      # ============================================================

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-Build-Logs
          path: |
            project/*.log
            /tmp/mgba/build-hoenn-3ds/CMakeCache.txt
          if-no-files-found: ignore
