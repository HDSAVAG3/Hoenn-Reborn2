name: Build Hoenn Reborn

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Hoenn Reborn
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. BASIC LINUX TOOLS
      # ============================================================

      - name: Install build utilities
        shell: bash
        run: |
          set -eux

          apt-get update

          apt-get install -y \
            zstd \
            unzip \
            wget \
            ca-certificates \
            python3 \
            cmake \
            make \
            git


      # ============================================================
      # 3. DEVKITPRO ENVIRONMENT
      # ============================================================

      - name: Configure devkitPro
        shell: bash
        run: |
          set -eux

          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM

          echo "DEVKITPRO=$DEVKITPRO" >> "$GITHUB_ENV"
          echo "DEVKITARM=$DEVKITARM" >> "$GITHUB_ENV"

          echo "$DEVKITARM/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPRO/tools/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPRO/devkitARM/bin" >> "$GITHUB_PATH"

          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          arm-none-eabi-gcc --version
          make --version
          cmake --version


      # ============================================================
      # 4. EXTRACT PROJECT
      # ============================================================

      - name: Extract Hoenn Reborn project
        shell: bash
        run: |
          set -eux

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name '*.zip' \
            | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          echo "Project ZIP:"
          echo "$ZIP_FILE"

          rm -rf /tmp/hoenn_extract
          mkdir -p /tmp/hoenn_extract

          unzip -q "$ZIP_FILE" -d /tmp/hoenn_extract

          MAKEFILE_PATH="$(find /tmp/hoenn_extract \
            -type f \
            -name 'Makefile' \
            | head -n 1)"

          if [ -z "$MAKEFILE_PATH" ]; then
            echo "ERROR: Makefile not found."
            find /tmp/hoenn_extract -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_SOURCE="$(dirname "$MAKEFILE_PATH")"

          echo "Project source:"
          echo "$PROJECT_SOURCE"

          rm -rf project
          mkdir -p project

          cp -a "$PROJECT_SOURCE"/. project/

          echo "Project extracted."


      # ============================================================
      # 5. BANNERTOOL
      # ============================================================

      - name: Install bannertool
        shell: bash
        run: |
          set -eux

          rm -rf /tmp/bannertool_extract
          mkdir -p /tmp/bannertool_extract

          wget -O /tmp/bannertool.zip \
            https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip

          unzip -q \
            /tmp/bannertool.zip \
            -d /tmp/bannertool_extract

          BANNER_BIN="$(find /tmp/bannertool_extract \
            -type f \
            -path '*linux-x86_64/bannertool' \
            | head -n 1)"

          if [ -z "$BANNER_BIN" ]; then
            echo "ERROR: x86_64 bannertool not found."
            find /tmp/bannertool_extract -type f
            exit 1
          fi

          cp "$BANNER_BIN" /usr/local/bin/bannertool

          chmod +x /usr/local/bin/bannertool

          test -x /usr/local/bin/bannertool

          echo "bannertool installed."


      # ============================================================
      # 6. MAKEROM
      # ============================================================

      - name: Install makerom
        shell: bash
        run: |
          set -eux

          rm -rf /tmp/makerom
          mkdir -p /tmp/makerom

          wget -O /tmp/makerom.zip \
            https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip

          unzip -q \
            /tmp/makerom.zip \
            -d /tmp/makerom

          MAKEROM_BIN="$(find /tmp/makerom \
            -type f \
            -name makerom \
            | head -n 1)"

          if [ -z "$MAKEROM_BIN" ]; then
            echo "ERROR: makerom not found."
            find /tmp/makerom -type f
            exit 1
          fi

          chmod +x "$MAKEROM_BIN"

          cp "$MAKEROM_BIN" /usr/local/bin/makerom

          chmod +x /usr/local/bin/makerom

          command -v makerom


      # ============================================================
      # 7. 3DS TOOLS
      # ============================================================

      - name: Install 3DS tools
        shell: bash
        run: |
          set -eux

          rm -rf /tmp/3dstools
          mkdir -p /tmp/3dstools

          wget -O /tmp/3dstools.pkg.tar.zst \
            https://wii.leseratte10.de/devkitPro/other-stuff/3dstools/3dstools-1.3.1-3-linux_x86_64.pkg.tar.zst

          tar \
            --zstd \
            -xf /tmp/3dstools.pkg.tar.zst \
            -C /tmp/3dstools

          cp -a \
            /tmp/3dstools/opt/devkitpro/. \
            /opt/devkitpro/

          find /opt/devkitpro \
            -type f \
            -name 3dsxtool \
            -exec chmod +x {} \; \
            || true

          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"


      # ============================================================
      # 8. TEX3DS
      # ============================================================

      - name: Install tex3ds
        shell: bash
        run: |
          set -eux

          rm -rf /tmp/tex3ds
          mkdir -p /tmp/tex3ds

          wget -O /tmp/tex3ds.pkg.tar.zst \
            https://wii.leseratte10.de/devkitPro/other-stuff/tex3ds/tex3ds-2.3.0-4-linux_x86_64.pkg.tar.zst

          tar \
            --zstd \
            -xf /tmp/tex3ds.pkg.tar.zst \
            -C /tmp/tex3ds

          cp -a \
            /tmp/tex3ds/opt/devkitpro/. \
            /opt/devkitpro/

          find /opt/devkitpro \
            -type f \
            -name tex3ds \
            -exec chmod +x {} \; \
            || true

          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"


      # ============================================================
      # 9. VERIFY TOOLS
      # ============================================================

      - name: Verify tools
        shell: bash
        run: |
          set -eux

          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          command -v bannertool
          command -v makerom
          command -v tex3ds

          find /opt/devkitpro \
            -type f \
            -name 3dsxtool \
            -print \
            | head -20


      # ============================================================
      # 10. DOWNLOAD MGBA
      # ============================================================

      - name: Download mGBA
        shell: bash
        run: |
          set -eux

          rm -rf "$GITHUB_WORKSPACE/mgba"

          wget -O /tmp/mgba.tar.gz \
            https://github.com/mgba-emu/mgba/archive/refs/tags/0.10.5.tar.gz

          tar \
            -xzf /tmp/mgba.tar.gz \
            -C "$GITHUB_WORKSPACE"

          mv \
            "$GITHUB_WORKSPACE/mgba-0.10.5" \
            "$GITHUB_WORKSPACE/mgba"

          test -f "$GITHUB_WORKSPACE/mgba/CMakeLists.txt"


      # ============================================================
      # 11. BUILD MGBA
      # ============================================================

      - name: Build mGBA
        shell: bash
        run: |
          set -eux

          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM

          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          rm -rf \
            "$GITHUB_WORKSPACE/mgba/build-hoenn-3ds"

          cmake \
            -S "$GITHUB_WORKSPACE/mgba" \
            -B "$GITHUB_WORKSPACE/mgba/build-hoenn-3ds" \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/mgba/src/platform/3ds/CMakeToolchain.txt" \
            -D3DS=ON \
            -DLIBMGBA_ONLY=ON \
            -DBUILD_STATIC=ON \
            -DBUILD_SHARED=OFF \
            -DM_CORE_GBA=ON \
            -DM_CORE_GB=OFF \
            -DDISABLE_DEPS=ON \
            -DBUILD_LTO=OFF

          cmake \
            --build "$GITHUB_WORKSPACE/mgba/build-hoenn-3ds" \
            --target mgba \
            -j2

          MGBA_LIB_SRC="$(find \
            "$GITHUB_WORKSPACE/mgba/build-hoenn-3ds" \
            -type f \
            -name libmgba.a \
            | head -n 1)"

          if [ -z "$MGBA_LIB_SRC" ]; then
            echo "ERROR: libmgba.a not found."
            exit 1
          fi

          ls -lh "$MGBA_LIB_SRC"


      # ============================================================
      # 12. STAGE MGBA
      # ============================================================

      - name: Stage mGBA
        shell: bash
        run: |
          set -eux

          rm -rf project/mgba

          cp -a \
            "$GITHUB_WORKSPACE/mgba" \
            project/mgba

          MGBA_LIB_SRC="$(find \
            "$GITHUB_WORKSPACE/mgba/build-hoenn-3ds" \
            -type f \
            -name libmgba.a \
            | head -n 1)"

          mkdir -p \
            project/mgba/build-hoenn-3ds

          cp \
            "$MGBA_LIB_SRC" \
            project/mgba/build-hoenn-3ds/libmgba-static.a

          mkdir -p \
            project/mgba/include

          cp -a \
            "$GITHUB_WORKSPACE/mgba/include/." \
            project/mgba/include/

          if [ -d "$GITHUB_WORKSPACE/mgba/build-hoenn-3ds/include" ]; then
            mkdir -p \
              project/mgba/build-hoenn-3ds/include

            cp -a \
              "$GITHUB_WORKSPACE/mgba/build-hoenn-3ds/include/." \
              project/mgba/build-hoenn-3ds/include/ \
              || true
          fi

          test -s \
            project/mgba/build-hoenn-3ds/libmgba-static.a


      # ============================================================
      # 13. BUILD LIBCTRU / CITRO3D / CITRO2D
      # ============================================================

      - name: Build 3DS libraries
        shell: bash
        run: |
          set -eux

          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM

          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          rm -rf /tmp/3ds-libraries
          mkdir -p /tmp/3ds-libraries

          cd /tmp/3ds-libraries


          # ========================================================
          # LIBCTRU
          # ========================================================

          wget -O libctru.tar.gz \
            https://github.com/devkitPro/libctru/archive/refs/tags/v2.7.0.tar.gz

          tar \
            -xzf libctru.tar.gz

          echo "libctru archive contents:"
          find /tmp/3ds-libraries/libctru-2.7.0 \
            -maxdepth 3 \
            -type f \
            | head -80

          LIBCTRU_MAKEFILE="$(find \
            /tmp/3ds-libraries/libctru-2.7.0 \
            -type f \
            -name Makefile \
            | head -n 1)"

          if [ -z "$LIBCTRU_MAKEFILE" ]; then
            echo "ERROR: libctru Makefile not found."
            exit 1
          fi

          LIBCTRU_DIR="$(dirname "$LIBCTRU_MAKEFILE")"

          echo "libctru Makefile:"
          echo "$LIBCTRU_MAKEFILE"

          echo "libctru build directory:"
          echo "$LIBCTRU_DIR"

          make \
            -C "$LIBCTRU_DIR" \
            -j2

          make \
            -C "$LIBCTRU_DIR" \
            install


          # ========================================================
          # CITRO3D
          # ========================================================

          wget -O citro3d.tar.gz \
            https://github.com/devkitPro/citro3d/archive/refs/tags/v1.7.1.tar.gz

          tar \
            -xzf citro3d.tar.gz

          CITRO3D_MAKEFILE="$(find \
            /tmp/3ds-libraries/citro3d-1.7.1 \
            -maxdepth 2 \
            -type f \
            -name Makefile \
            | head -n 1)"

          if [ -z "$CITRO3D_MAKEFILE" ]; then
            echo "ERROR: citro3d Makefile not found."
            exit 1
          fi

          CITRO3D_DIR="$(dirname "$CITRO3D_MAKEFILE")"

          echo "citro3d directory:"
          echo "$CITRO3D_DIR"

          make \
            -C "$CITRO3D_DIR" \
            -j2

          make \
            -C "$CITRO3D_DIR" \
            install


          # ========================================================
          # CITRO2D
          # ========================================================

          wget -O citro2d.tar.gz \
            https://github.com/devkitPro/citro2d/archive/refs/tags/v1.7.0.tar.gz

          tar \
            -xzf citro2d.tar.gz

          CITRO2D_MAKEFILE="$(find \
            /tmp/3ds-libraries/citro2d-1.7.0 \
            -maxdepth 2 \
            -type f \
            -name Makefile \
            | head -n 1)"

          if [ -z "$CITRO2D_MAKEFILE" ]; then
            echo "ERROR: citro2d Makefile not found."
            exit 1
          fi

          CITRO2D_DIR="$(dirname "$CITRO2D_MAKEFILE")"

          echo "citro2d directory:"
          echo "$CITRO2D_DIR"

          make \
            -C "$CITRO2D_DIR" \
            -j2

          make \
            -C "$CITRO2D_DIR" \
            install


          # ========================================================
          # VERIFY
          # ========================================================

          echo "========================================"
          echo "CHECKING 3DS LIBRARIES"
          echo "========================================"

          find "$DEVKITPRO/libctru" \
            -maxdepth 3 \
            -type f \
            \( \
              -name 'libctru.a' \
              -o \
              -name 'libcitro3d.a' \
              -o \
              -name 'libcitro2d.a' \
            \) \
            -print

          test -f \
            "$DEVKITPRO/libctru/lib/libctru.a"

          test -f \
            "$DEVKITPRO/libctru/lib/libcitro3d.a"

          test -f \
            "$DEVKITPRO/libctru/lib/libcitro2d.a"

          echo "3DS libraries successfully installed."


      # ============================================================
      # 14. PATCH MAKEFILE
      # ============================================================

      - name: Patch Hoenn Reborn Makefile
        shell: bash
        run: |
          set -eux

          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/Makefile")

          s = p.read_text()

          # Fix mGBA path.
          s = s.replace(
              "MGBA_DIR ?= ../mgba",
              "MGBA_DIR ?= ./mgba"
          )

          # Fix tex3ds PNG syntax.
          s = s.replace(
              "tex3ds -i $< -o $@",
              'tex3ds "$<" -o "$@"'
          )

          # Prevent make from trying to rebuild mGBA.
          if "mgba-core:" in s and "\n3dsx:" in s:
              start = s.index("mgba-core:")
              end = s.index("\n3dsx:", start)

              tab = chr(9)

              replacement = (
                  "mgba-core:\n"
                  + tab
                  + '@test -f "$(MGBA_LIB)"\n'
              )

              s = s[:start] + replacement + s[end:]

          p.write_text(s)
          PY


      # ============================================================
      # 15. VERIFY MAKEFILE
      # ============================================================

      - name: Verify Makefile
        shell: bash
        run: |
          set -eux

          grep -n \
            -E 'MGBA_DIR|MGBA_LIB|MGBA_INC|MGBA_GEN_INC' \
            project/Makefile \
            || true

          echo "--------------------------------"

          grep -n \
            tex3ds \
            project/Makefile \
            || true

          echo "--------------------------------"

          grep -n \
            '^LIBS' \
            project/Makefile \
            || true

          echo "--------------------------------"

          test -s \
            project/mgba/build-hoenn-3ds/libmgba-static.a


      # ============================================================
      # 16. BUILD
      # ============================================================

      - name: Build Hoenn Reborn
        shell: bash
        run: |
          set -eux

          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM

          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          cd project

          echo "========================================"
          echo "BUILDING HOENN REBORN"
          echo "========================================"

          make -j1


      # ============================================================
      # 17. VERIFY CIA
      # ============================================================

      - name: Verify CIA
        shell: bash
        run: |
          set -eux

          test -f project/Hoenn_Reborn.cia

          ls -lh project/Hoenn_Reborn.cia

          wc -c project/Hoenn_Reborn.cia


      # ============================================================
      # 18. VERIFY 3DSX
      # ============================================================

      - name: Verify 3DSX
        shell: bash
        run: |
          set -eux

          test -f project/Hoenn_Reborn.3dsx

          ls -lh project/Hoenn_Reborn.3dsx

          wc -c project/Hoenn_Reborn.3dsx


      # ============================================================
      # 19. VERIFY ELF
      # ============================================================

      - name: Verify ELF
        shell: bash
        run: |
          set -eux

          test -f project/Hoenn_Reborn.elf

          ls -lh project/Hoenn_Reborn.elf

          wc -c project/Hoenn_Reborn.elf


      # ============================================================
      # 20. UPLOAD CIA
      # ============================================================

      - name: Upload CIA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn_Reborn_CIA
          path: project/Hoenn_Reborn.cia
          if-no-files-found: error


      # ============================================================
      # 21. UPLOAD 3DSX
      # ============================================================

      - name: Upload 3DSX
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn_Reborn_3DSX
          path: project/Hoenn_Reborn.3dsx
          if-no-files-found: error


      # ============================================================
      # 22. UPLOAD ELF
      # ============================================================

      - name: Upload ELF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn_Reborn_ELF
          path: project/Hoenn_Reborn.elf
          if-no-files-found: error


      # ============================================================
      # 23. ALWAYS UPLOAD BUILD FILES
      # ============================================================

      - name: Upload build files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn_Reborn_Build_Files
          path: project
          if-no-files-found: warn
