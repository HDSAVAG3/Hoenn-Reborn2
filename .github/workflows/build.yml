name: Build Hoenn Reborn

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # LINUX TOOLS
      # ============================================================

      - name: Install Linux build tools
        shell: bash
        run: |
          set -e

          apt-get update

          apt-get install -y \
            wget \
            curl \
            git \
            cmake \
            make \
            python3 \
            unzip \
            xz-utils \
            zstd \
            file

          echo "Linux build tools installed."


      # ============================================================
      # DEVKITPRO ENVIRONMENT
      # ============================================================

      - name: Configure devkitPro environment
        shell: bash
        run: |
          set -e

          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM

          echo "DEVKITPRO=$DEVKITPRO" >> "$GITHUB_ENV"
          echo "DEVKITARM=$DEVKITARM" >> "$GITHUB_ENV"

          echo "/opt/devkitpro/devkitARM/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/portlibs/3ds/bin" >> "$GITHUB_PATH"

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"


      # ============================================================
      # INSTALL 3DS CMAKE
      # ============================================================

      - name: Install devkitPro CMake helpers
        shell: bash
        run: |
          set -e

          cd /tmp

          echo "Downloading 3DS CMake..."

          wget -O 3ds-cmake.pkg.tar.zst \
            https://wii.leseratte10.de/devkitPro/cmake/3ds-cmake-1.5.2-1-any.pkg.tar.zst

          rm -rf /tmp/3ds-cmake
          mkdir -p /tmp/3ds-cmake

          tar \
            --use-compress-program=unzstd \
            -xf 3ds-cmake.pkg.tar.zst \
            -C /tmp/3ds-cmake

          echo "Installing 3DS CMake..."

          cp -a \
            /tmp/3ds-cmake/opt/devkitpro/. \
            /opt/devkitpro/

          echo "Downloading Catnip..."

          wget -O catnip.pkg.tar.zst \
            https://wii.leseratte10.de/devkitPro/other-stuff/catnip-0.2.0-1-any.pkg.tar.zst

          rm -rf /tmp/catnip
          mkdir -p /tmp/catnip

          tar \
            --use-compress-program=unzstd \
            -xf catnip.pkg.tar.zst \
            -C /tmp/catnip

          echo "Installing Catnip..."

          cp -a \
            /tmp/catnip/opt/devkitpro/. \
            /opt/devkitpro/

          echo "3DS CMake helpers installed."


      # ============================================================
      # VERIFY 3DS CMAKE
      # ============================================================

      - name: Verify devkitPro CMake
        shell: bash
        run: |
          set -e

          export PATH="/opt/devkitpro/portlibs/3ds/bin:$PATH"
          export PATH="/opt/devkitpro/tools/bin:$PATH"
          export PATH="/opt/devkitpro/devkitARM/bin:$PATH"

          CMAKE3DS="$(
            find /opt/devkitpro \
              -type f \
              -name arm-none-eabi-cmake \
              -print \
              -quit
          )"

          if [ -z "$CMAKE3DS" ]; then
            echo "ERROR: arm-none-eabi-cmake was not found."
            exit 1
          fi

          chmod +x "$CMAKE3DS"

          echo "3DS CMake:"
          echo "$CMAKE3DS"

          "$CMAKE3DS" --version

          echo "3DS CMake is ready."


      # ============================================================
      # INSTALL 3DS TOOLS
      # ============================================================

      - name: Install 3dstools
        shell: bash
        run: |
          set -e

          cd /tmp

          wget -O 3dstools.pkg.tar.zst \
            https://wii.leseratte10.de/devkitPro/other-stuff/3dstools/3dstools-1.3.1-3-linux_x86_64.pkg.tar.zst

          rm -rf /tmp/3dstools
          mkdir -p /tmp/3dstools

          tar \
            --use-compress-program=unzstd \
            -xf 3dstools.pkg.tar.zst \
            -C /tmp/3dstools

          if [ -d /tmp/3dstools/opt/devkitpro/tools ]; then
            mkdir -p /opt/devkitpro/tools

            cp -a \
              /tmp/3dstools/opt/devkitpro/tools/. \
              /opt/devkitpro/tools/
          fi

          if [ -d /tmp/3dstools/usr/bin ]; then
            mkdir -p /opt/devkitpro/tools/bin

            cp -a \
              /tmp/3dstools/usr/bin/. \
              /opt/devkitpro/tools/bin/
          fi

          find /opt/devkitpro/tools \
            -type f \
            \( \
              -name tex3ds \
              -o \
              -name 3dsxtool \
            \) \
            -exec chmod +x {} \; \
            2>/dev/null || true

          echo "3dstools installed."


      # ============================================================
      # INSTALL BANNERTOOL
      # ============================================================

      - name: Install bannertool
        shell: bash
        run: |
          set -e

          cd /tmp

          wget -O bannertool.zip \
            https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip

          rm -rf /tmp/bannertool
          mkdir -p /tmp/bannertool

          unzip -q bannertool.zip -d /tmp/bannertool

          BANNERTOOL_BIN="/tmp/bannertool/linux-x86_64/bannertool"

          if [ ! -f "$BANNERTOOL_BIN" ]; then
            echo "ERROR: bannertool binary not found."
            find /tmp/bannertool -type f -print
            exit 1
          fi

          chmod +x "$BANNERTOOL_BIN"

          cp "$BANNERTOOL_BIN" \
            /opt/devkitpro/tools/bin/bannertool

          chmod +x \
            /opt/devkitpro/tools/bin/bannertool

          echo "bannertool installed."


      # ============================================================
      # INSTALL MAKEROM
      # ============================================================

      - name: Install makerom
        shell: bash
        run: |
          set -e

          cd /tmp

          wget -O makerom.zip \
            https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip

          rm -rf /tmp/makerom
          mkdir -p /tmp/makerom

          unzip -q makerom.zip -d /tmp/makerom

          MAKEROM_BIN="$(
            find /tmp/makerom \
              -type f \
              -name makerom \
              -print \
              -quit
          )"

          if [ -z "$MAKEROM_BIN" ]; then
            echo "ERROR: makerom not found."

            find /tmp/makerom \
              -type f \
              -print

            exit 1
          fi

          chmod +x "$MAKEROM_BIN"

          cp "$MAKEROM_BIN" \
            /opt/devkitpro/tools/bin/makerom

          chmod +x \
            /opt/devkitpro/tools/bin/makerom

          echo "makerom installed."


      # ============================================================
      # VERIFY TOOLS
      # ============================================================

      - name: Verify 3DS tools
        shell: bash
        run: |
          set -e

          export PATH="/opt/devkitpro/portlibs/3ds/bin:$PATH"
          export PATH="/opt/devkitpro/tools/bin:$PATH"
          export PATH="/opt/devkitpro/devkitARM/bin:$PATH"

          echo "======================================"
          echo "VERIFYING 3DS TOOLCHAIN"
          echo "======================================"

          echo "ARM compiler:"
          command -v arm-none-eabi-gcc

          echo "3DS CMake:"
          command -v arm-none-eabi-cmake

          echo "bannertool:"
          command -v bannertool

          echo "makerom:"
          command -v makerom

          echo "tex3ds:"
          command -v tex3ds

          echo "3dsxtool:"
          command -v 3dsxtool

          echo "======================================"
          echo "3DS TOOLCHAIN READY"
          echo "======================================"


      # ============================================================
      # BUILD LIBCTRU
      # ============================================================

      - name: Build libctru
        shell: bash
        run: |
          set -e

          cd /tmp

          rm -rf /tmp/libctru
          mkdir -p /tmp/libctru

          wget -O libctru.tar.gz \
            https://github.com/devkitPro/libctru/archive/refs/tags/v2.7.0.tar.gz

          tar \
            -xzf libctru.tar.gz \
            -C /tmp/libctru

          LIBCTRU_ROOT="$(
            find /tmp/libctru/libctru-2.7.0 \
              -type f \
              -name Makefile \
              -print \
              -quit \
              | xargs dirname
          )"

          if [ -z "$LIBCTRU_ROOT" ]; then
            echo "ERROR: libctru Makefile not found."
            exit 1
          fi

          echo "libctru root:"
          echo "$LIBCTRU_ROOT"

          GDBHIO_FILE="$(
            find /tmp/libctru/libctru-2.7.0 \
              -type f \
              -name gdbhio.c \
              -print \
              -quit
          )"

          if [ -z "$GDBHIO_FILE" ]; then
            echo "ERROR: gdbhio.c not found."
            exit 1
          fi

          echo "Patching gdbMode warning..."

          python3 - "$GDBHIO_FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])
          text = p.read_text()

          pattern = re.compile(
              r'(?m)^(\s*)gdbhio_mode_t\s+gdbMode\s*=\s*0\s*;\s*$'
          )

          match = pattern.search(text)

          if match:
              replacement = (
                  match.group(1)
                  + "gdbhio_mode_t gdbMode "
                    "__attribute__((unused)) = 0;"
              )

              text = (
                  text[:match.start()]
                  + replacement
                  + text[match.end():]
              )

              p.write_text(text)

              print("gdbMode patched.")

          elif "__attribute__((unused))" in text and "gdbMode" in text:
              print("gdbMode already patched.")

          else:
              raise SystemExit(
                  "ERROR: gdbMode declaration not found."
              )
          PY

          grep -n \
            "gdbhio_mode_t gdbMode" \
            "$GDBHIO_FILE"

          cd "$LIBCTRU_ROOT"

          make -j2
          make install

          echo "libctru complete."


      # ============================================================
      # BUILD CITRO3D
      # ============================================================

      - name: Build citro3d
        shell: bash
        run: |
          set -e

          cd /tmp

          rm -rf /tmp/citro3d
          mkdir -p /tmp/citro3d

          wget -O citro3d.tar.gz \
            https://github.com/devkitPro/citro3d/archive/refs/tags/v1.7.1.tar.gz

          tar \
            -xzf citro3d.tar.gz \
            -C /tmp/citro3d

          CITRO3D_ROOT="/tmp/citro3d/citro3d-1.7.1"

          if [ ! -f "$CITRO3D_ROOT/Makefile" ]; then
            echo "ERROR: citro3d Makefile not found."
            exit 1
          fi

          cd "$CITRO3D_ROOT"

          make -j2
          make install

          echo "citro3d complete."


      # ============================================================
      # BUILD CITRO2D
      # ============================================================

      - name: Build citro2d
        shell: bash
        run: |
          set -e

          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM

          export PATH="/opt/devkitpro/portlibs/3ds/bin:$PATH"
          export PATH="/opt/devkitpro/tools/bin:$PATH"
          export PATH="/opt/devkitpro/devkitARM/bin:$PATH"

          cd /tmp

          rm -rf /tmp/citro2d
          mkdir -p /tmp/citro2d

          wget -O citro2d.tar.gz \
            https://github.com/devkitPro/citro2d/archive/refs/tags/v1.7.0.tar.gz

          tar \
            -xzf citro2d.tar.gz \
            -C /tmp/citro2d

          CITRO2D_ROOT="/tmp/citro2d/citro2d-1.7.0"

          if [ ! -f "$CITRO2D_ROOT/CMakeLists.txt" ]; then
            echo "ERROR: citro2d CMakeLists.txt not found."
            exit 1
          fi

          echo "======================================"
          echo "BUILDING CITRO2D"
          echo "======================================"

          command -v arm-none-eabi-cmake

          arm-none-eabi-cmake \
            -S "$CITRO2D_ROOT" \
            -B "$CITRO2D_ROOT/build" \
            -DCMAKE_INSTALL_PREFIX=/opt/devkitpro/libctru \
            -DCMAKE_BUILD_TYPE=Release

          arm-none-eabi-cmake \
            --build "$CITRO2D_ROOT/build" \
            -j2

          arm-none-eabi-cmake \
            --install "$CITRO2D_ROOT/build"

          echo "======================================"
          echo "CITRO2D BUILD/INSTALL COMPLETE"
          echo "======================================"


      # ============================================================
      # VERIFY 3DS LIBRARIES
      # ============================================================

      - name: Verify 3DS libraries
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "LIBCTRU"
          echo "======================================"

          find /opt/devkitpro \
            -name libctru.a \
            -print

          echo "======================================"
          echo "LIBCITRO3D"
          echo "======================================"

          find /opt/devkitpro \
            -name libcitro3d.a \
            -print

          echo "======================================"
          echo "LIBCITRO2D"
          echo "======================================"

          find /opt/devkitpro \
            -name libcitro2d.a \
            -print

          test -f \
            /opt/devkitpro/libctru/lib/libctru.a

          test -f \
            /opt/devkitpro/libctru/lib/libcitro3d.a

          test -f \
            /opt/devkitpro/libctru/lib/libcitro2d.a

          echo "======================================"
          echo "ALL 3DS LIBRARIES FOUND"
          echo "======================================"


      # ============================================================
      # DOWNLOAD mGBA
      # ============================================================

      - name: Download mGBA source
        shell: bash
        run: |
          set -e

          cd /tmp

          echo "======================================"
          echo "DOWNLOADING mGBA 0.10.5"
          echo "======================================"

          rm -rf /tmp/mgba-source
          mkdir -p /tmp/mgba-source

          wget -O /tmp/mgba.tar.gz \
            https://github.com/mgba-emu/mgba/archive/refs/tags/0.10.5.tar.gz

          echo "mGBA archive downloaded."

          tar \
            -xzf /tmp/mgba.tar.gz \
            -C /tmp/mgba-source

          echo "Extracted mGBA directories:"

          find /tmp/mgba-source \
            -maxdepth 2 \
            -type f \
            -name CMakeLists.txt \
            -print

          MGBA_ROOT="$(
            find /tmp/mgba-source \
              -mindepth 1 \
              -maxdepth 2 \
              -type f \
              -name CMakeLists.txt \
              -print \
              -quit \
              | xargs dirname
          )"

          if [ -z "$MGBA_ROOT" ]; then
            echo "ERROR: Could not locate mGBA CMakeLists.txt."
            find /tmp/mgba-source -maxdepth 3 -print
            exit 1
          fi

          echo "mGBA source found at:"
          echo "$MGBA_ROOT"

          rm -rf "$GITHUB_WORKSPACE/mgba"

          cp -a \
            "$MGBA_ROOT" \
            "$GITHUB_WORKSPACE/mgba"

          echo "mGBA source installed at:"
          echo "$GITHUB_WORKSPACE/mgba"

          test -f \
            "$GITHUB_WORKSPACE/mgba/CMakeLists.txt"

          echo "======================================"
          echo "mGBA SOURCE READY"
          echo "======================================"


      # ============================================================
      # VERIFY mGBA
      # ============================================================

      - name: Verify mGBA source
        shell: bash
        run: |
          set -e

          echo "mGBA directory:"
          ls -la "$GITHUB_WORKSPACE/mgba"

          echo "mGBA CMakeLists:"
          test -f \
            "$GITHUB_WORKSPACE/mgba/CMakeLists.txt"

          echo "mGBA source verified."


      # ============================================================
      # LOCATE HOENN REBORN PROJECT
      # ============================================================

      - name: Locate Hoenn Reborn project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "LOCATING HOENN REBORN PROJECT"
          echo "======================================"

          PROJECT_ROOT="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name Makefile \
              -not -path '*/mgba/*' \
              -print \
              | head -n 1 \
              | xargs dirname
          )"

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Hoenn Reborn Makefile not found."

            echo "Repository contents:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 4 \
              -type f \
              -print

            exit 1
          fi

          echo "Hoenn Reborn project found:"
          echo "$PROJECT_ROOT"

          echo "HOENN_PROJECT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "======================================"
          echo "HOENN PROJECT LOCATED"
          echo "======================================"


      # ============================================================
      # VERIFY PROJECT STRUCTURE
      # ============================================================

      - name: Verify project structure
        shell: bash
        run: |
          set -e

          PROJECT="$HOENN_PROJECT"

          echo "Project:"
          echo "$PROJECT"

          test -f "$PROJECT/Makefile"

          test -f "$PROJECT/cia.rsf"

          test -f "$PROJECT/source/main.c"
          test -f "$PROJECT/source/dashboard.c"
          test -f "$PROJECT/source/game_data.c"
          test -f "$PROJECT/source/gba_core_mgba.c"

          test -d "$PROJECT/romfs/hoenn_reborn"

          echo "======================================"
          echo "PROJECT STRUCTURE VERIFIED"
          echo "======================================"


      # ============================================================
      # PATCH MAKEFILE
      # ============================================================

      - name: Patch Hoenn Reborn Makefile
        shell: bash
        run: |
          set -e

          PROJECT="$HOENN_PROJECT"

          python3 - "$PROJECT/Makefile" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])

          text = p.read_text()

          text = text.replace(
              "mgba-static",
              "mgba"
          )

          p.write_text(text)

          print("Makefile patched.")
          PY

          echo "Patched Makefile:"
          grep -n \
            "mgba" \
            "$PROJECT/Makefile" || true


      # ============================================================
      # BUILD mGBA CORE
      # ============================================================

      - name: Build mGBA core
        shell: bash
        run: |
          set -e

          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM

          export PATH="/opt/devkitpro/portlibs/3ds/bin:$PATH"
          export PATH="/opt/devkitpro/tools/bin:$PATH"
          export PATH="/opt/devkitpro/devkitARM/bin:$PATH"

          cd "$HOENN_PROJECT"

          echo "======================================"
          echo "BUILDING mGBA"
          echo "======================================"

          mkdir -p \
            "$HOENN_PROJECT/mgba/build-hoenn-3ds"

          arm-none-eabi-cmake \
            -S "$GITHUB_WORKSPACE/mgba" \
            -B "$HOENN_PROJECT/mgba/build-hoenn-3ds" \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/mgba/src/platform/3ds/CMakeToolchain.txt" \
            -D3DS=ON \
            -DLIBMGBA_ONLY=ON \
            -DBUILD_STATIC=ON \
            -DBUILD_SHARED=OFF \
            -DM_CORE_GBA=ON \
            -DM_CORE_GB=OFF \
            -DDISABLE_DEPS=ON \
            -DBUILD_LTO=OFF

          echo "Building mGBA..."

          arm-none-eabi-cmake \
            --build "$HOENN_PROJECT/mgba/build-hoenn-3ds" \
            -j2

          echo "Searching for libmgba.a..."

          find "$HOENN_PROJECT/mgba/build-hoenn-3ds" \
            -name libmgba.a \
            -print

          MGBA_LIB="$(
            find "$HOENN_PROJECT/mgba/build-hoenn-3ds" \
              -name libmgba.a \
              -print \
              -quit
          )"

          if [ -z "$MGBA_LIB" ]; then
            echo "ERROR: libmgba.a was not built."

            find "$HOENN_PROJECT/mgba/build-hoenn-3ds" \
              -type f \
              -print

            exit 1
          fi

          echo "mGBA library:"
          echo "$MGBA_LIB"

          if [ "$MGBA_LIB" != "$HOENN_PROJECT/mgba/build-hoenn-3ds/libmgba.a" ]; then
            cp "$MGBA_LIB" \
              "$HOENN_PROJECT/mgba/build-hoenn-3ds/libmgba.a"
          fi

          echo "======================================"
          echo "mGBA BUILD COMPLETE"
          echo "======================================"


      # ============================================================
      # BUILD HOENN REBORN
      # ============================================================

      - name: Build Hoenn Reborn
        shell: bash
        run: |
          set -e

          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM

          export PATH="/opt/devkitpro/portlibs/3ds/bin:$PATH"
          export PATH="/opt/devkitpro/tools/bin:$PATH"
          export PATH="/opt/devkitpro/devkitARM/bin:$PATH"

          cd "$HOENN_PROJECT"

          echo "======================================"
          echo "HOENN REBORN BUILD"
          echo "======================================"

          echo "Project directory:"
          pwd

          echo "Starting make..."

          make -j2

          echo "======================================"
          echo "HOENN REBORN BUILD COMPLETE"
          echo "======================================"


      # ============================================================
      # VERIFY CIA
      # ============================================================

      - name: Verify CIA
        shell: bash
        run: |
          set -e

          cd "$HOENN_PROJECT"

          test -f Hoenn_Reborn.cia

          echo "======================================"
          echo "CIA BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh Hoenn_Reborn.cia

          wc -c Hoenn_Reborn.cia


      # ============================================================
      # VERIFY 3DSX
      # ============================================================

      - name: Verify 3DSX
        shell: bash
        run: |
          set -e

          cd "$HOENN_PROJECT"

          test -f Hoenn_Reborn.3dsx

          echo "======================================"
          echo "3DSX BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh Hoenn_Reborn.3dsx

          wc -c Hoenn_Reborn.3dsx


      # ============================================================
      # VERIFY ELF
      # ============================================================

      - name: Verify ELF
        shell: bash
        run: |
          set -e

          cd "$HOENN_PROJECT"

          test -f Hoenn_Reborn.elf

          echo "======================================"
          echo "ELF BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh Hoenn_Reborn.elf

          wc -c Hoenn_Reborn.elf


      # ============================================================
      # PREPARE BUILD ARTIFACTS
      # ============================================================

      - name: Prepare build artifacts
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/build-artifacts"

          cp "$HOENN_PROJECT/Hoenn_Reborn.cia" \
            "$GITHUB_WORKSPACE/build-artifacts/"

          cp "$HOENN_PROJECT/Hoenn_Reborn.3dsx" \
            "$GITHUB_WORKSPACE/build-artifacts/"

          cp "$HOENN_PROJECT/Hoenn_Reborn.elf" \
            "$GITHUB_WORKSPACE/build-artifacts/"

          if [ -f "$HOENN_PROJECT/Hoenn_Reborn.smdh" ]; then
            cp "$HOENN_PROJECT/Hoenn_Reborn.smdh" \
              "$GITHUB_WORKSPACE/build-artifacts/"
          fi

          if [ -f "$HOENN_PROJECT/Hoenn_Reborn.bnr" ]; then
            cp "$HOENN_PROJECT/Hoenn_Reborn.bnr" \
              "$GITHUB_WORKSPACE/build-artifacts/"
          fi

          echo "Build artifacts prepared."

          ls -lh \
            "$GITHUB_WORKSPACE/build-artifacts"


      # ============================================================
      # UPLOAD CIA
      # ============================================================

      - name: Upload CIA
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-CIA
          path: build-artifacts/Hoenn_Reborn.cia
          if-no-files-found: error


      # ============================================================
      # UPLOAD 3DSX
      # ============================================================

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-3DSX
          path: build-artifacts/Hoenn_Reborn.3dsx
          if-no-files-found: error


      # ============================================================
      # UPLOAD ELF
      # ============================================================

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-ELF
          path: build-artifacts/Hoenn_Reborn.elf
          if-no-files-found: error


      # ============================================================
      # UPLOAD EVERYTHING
      # ============================================================

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-Build-Files
