name: Build Hoenn Reborn

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # LINUX TOOLS
      # ============================================================

      - name: Install Linux build tools
        run: |
          apt-get update

          apt-get install -y \
            wget \
            curl \
            git \
            cmake \
            make \
            python3 \
            unzip \
            xz-utils \
            zstd \
            file


      # ============================================================
      # DEVKITPRO ENVIRONMENT
      # ============================================================

      - name: Configure devkitPro environment
        shell: bash
        run: |
          echo "/opt/devkitpro/devkitARM/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/portlibs/3ds/bin" >> "$GITHUB_PATH"

          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM

          echo "DEVKITPRO=$DEVKITPRO" >> "$GITHUB_ENV"
          echo "DEVKITARM=$DEVKITARM" >> "$GITHUB_ENV"

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"


      # ============================================================
      # EXTRACT HOENN REBORN ZIP
      # ============================================================

      - name: Extract Hoenn Reborn project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR HOENN REBORN ZIP"
          echo "======================================"

          ZIP_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -name 'Hoenn_Reborn_GitHub_Build.zip' \
              -print \
              -quit
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Hoenn_Reborn_GitHub_Build.zip was not found."

            find "$GITHUB_WORKSPACE" \
              -maxdepth 4 \
              -type f \
              -print

            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          PROJECT_DIR="$GITHUB_WORKSPACE/hoenn_project"

          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"

          unzip -q "$ZIP_FILE" -d "$PROJECT_DIR"

          echo "======================================"
          echo "PROJECT EXTRACTED"
          echo "======================================"

          find "$PROJECT_DIR" \
            -maxdepth 4 \
            -type f \
            -print


      # ============================================================
      # INSTALL 3DS CMAKE
      # ============================================================

      - name: Install devkitPro CMake helpers
        shell: bash
        run: |
          set -e

          cd /tmp

          wget -O 3ds-cmake.pkg.tar.zst \
            https://wii.leseratte10.de/devkitPro/cmake/3ds-cmake-1.5.2-1-any.pkg.tar.zst

          rm -rf /tmp/3ds-cmake
          mkdir -p /tmp/3ds-cmake

          tar \
            --use-compress-program=unzstd \
            -xf 3ds-cmake.pkg.tar.zst \
            -C /tmp/3ds-cmake

          cp -a \
            /tmp/3ds-cmake/opt/devkitpro/. \
            /opt/devkitpro/

          wget -O catnip.pkg.tar.zst \
            https://wii.leseratte10.de/devkitPro/other-stuff/catnip-0.2.0-1-any.pkg.tar.zst

          rm -rf /tmp/catnip
          mkdir -p /tmp/catnip

          tar \
            --use-compress-program=unzstd \
            -xf catnip.pkg.tar.zst \
            -C /tmp/catnip

          cp -a \
            /tmp/catnip/opt/devkitpro/. \
            /opt/devkitpro/

          echo "CMake helpers installed."


      # ============================================================
      # VERIFY CMAKE
      # ============================================================

      - name: Verify devkitPro CMake
        shell: bash
        run: |
          set -e

          export PATH="/opt/devkitpro/portlibs/3ds/bin:$PATH"
          export PATH="/opt/devkitpro/tools/bin:$PATH"
          export PATH="/opt/devkitpro/devkitARM/bin:$PATH"

          CMAKE3DS="$(
            find /opt/devkitpro \
              -type f \
              -name arm-none-eabi-cmake \
              -print \
              -quit
          )"

          if [ -z "$CMAKE3DS" ]; then
            echo "ERROR: arm-none-eabi-cmake not found."
            exit 1
          fi

          chmod +x "$CMAKE3DS"

          echo "Found:"
          echo "$CMAKE3DS"

          "$CMAKE3DS" --version


      # ============================================================
      # VERIFY CATNIP
      # ============================================================

      - name: Verify Catnip
        shell: bash
        run: |
          set -e

          export PATH="/opt/devkitpro/portlibs/3ds/bin:$PATH"
          export PATH="/opt/devkitpro/tools/bin:$PATH"
          export PATH="/opt/devkitpro/devkitARM/bin:$PATH"

          CATNIP_BIN="$(
            find /opt/devkitpro \
              -type f \
              -name catnip \
              -print \
              -quit
          )"

          if [ -z "$CATNIP_BIN" ]; then
            echo "ERROR: catnip not found."
            exit 1
          fi

          chmod +x "$CATNIP_BIN"

          echo "Catnip:"
          echo "$CATNIP_BIN"


      # ============================================================
      # INSTALL 3DS TOOLS
      # ============================================================

      - name: Install 3dstools
        shell: bash
        run: |
          set -e

          cd /tmp

          wget -O 3dstools.pkg.tar.zst \
            https://wii.leseratte10.de/devkitPro/other-stuff/3dstools/3dstools-1.3.1-3-linux_x86_64.pkg.tar.zst

          rm -rf /tmp/3dstools
          mkdir -p /tmp/3dstools

          tar \
            --use-compress-program=unzstd \
            -xf 3dstools.pkg.tar.zst \
            -C /tmp/3dstools

          if [ -d /tmp/3dstools/opt/devkitpro/tools ]; then
            cp -a \
              /tmp/3dstools/opt/devkitpro/tools/. \
              /opt/devkitpro/tools/
          fi

          if [ -d /tmp/3dstools/usr/bin ]; then
            cp -a \
              /tmp/3dstools/usr/bin/. \
              /opt/devkitpro/tools/bin/
          fi

          find /opt/devkitpro/tools \
            -type f \
            \( \
              -name tex3ds \
              -o \
              -name 3dsxtool \
            \) \
            -exec chmod +x {} \; \
            2>/dev/null || true

          echo "3dstools installed."


      # ============================================================
      # INSTALL BANNERTOOL
      # ============================================================

      - name: Install bannertool
        shell: bash
        run: |
          set -e

          cd /tmp

          wget -O bannertool.zip \
            https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip

          rm -rf /tmp/bannertool
          mkdir -p /tmp/bannertool

          unzip -q bannertool.zip -d /tmp/bannertool

          BANNERTOOL_BIN="/tmp/bannertool/linux-x86_64/bannertool"

          test -f "$BANNERTOOL_BIN"

          chmod +x "$BANNERTOOL_BIN"

          cp \
            "$BANNERTOOL_BIN" \
            /opt/devkitpro/tools/bin/bannertool

          chmod +x \
            /opt/devkitpro/tools/bin/bannertool

          echo "bannertool installed."


      # ============================================================
      # INSTALL MAKEROM
      # ============================================================

      - name: Install makerom
        shell: bash
        run: |
          set -e

          cd /tmp

          wget -O makerom.zip \
            https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip

          rm -rf /tmp/makerom
          mkdir -p /tmp/makerom

          unzip -q makerom.zip -d /tmp/makerom

          MAKEROM_BIN="$(
            find /tmp/makerom \
              -type f \
              -name makerom \
              -print \
              -quit
          )"

          test -n "$MAKEROM_BIN"

          chmod +x "$MAKEROM_BIN"

          cp \
            "$MAKEROM_BIN" \
            /opt/devkitpro/tools/bin/makerom

          chmod +x \
            /opt/devkitpro/tools/bin/makerom

          echo "makerom installed."


      # ============================================================
      # VERIFY TOOLS
      # ============================================================

      - name: Verify 3DS tools
        shell: bash
        run: |
          set -e

          export PATH="/opt/devkitpro/portlibs/3ds/bin:$PATH"
          export PATH="/opt/devkitpro/tools/bin:$PATH"
          export PATH="/opt/devkitpro/devkitARM/bin:$PATH"

          command -v arm-none-eabi-gcc
          command -v arm-none-eabi-cmake
          command -v bannertool
          command -v makerom
          command -v tex3ds
          command -v 3dsxtool

          echo "======================================"
          echo "ALL 3DS TOOLS AVAILABLE"
          echo "======================================"


      # ============================================================
      # BUILD LIBCTRU
      # ============================================================

      - name: Build libctru
        shell: bash
        run: |
          set -e

          cd /tmp

          rm -rf /tmp/libctru
          mkdir -p /tmp/libctru

          wget -O libctru.tar.gz \
            https://github.com/devkitPro/libctru/archive/refs/tags/v2.7.0.tar.gz

          tar \
            -xzf libctru.tar.gz \
            -C /tmp/libctru

          LIBCTRU_ROOT="$(
            find /tmp/libctru/libctru-2.7.0 \
              -type f \
              -name Makefile \
              -print \
              -quit \
              | xargs dirname
          )"

          test -n "$LIBCTRU_ROOT"

          GDBHIO_FILE="$(
            find /tmp/libctru/libctru-2.7.0 \
              -type f \
              -name gdbhio.c \
              -print \
              -quit
          )"

          test -n "$GDBHIO_FILE"

          python3 - "$GDBHIO_FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])
          text = p.read_text()

          pattern = re.compile(
              r'(?m)^(\s*)gdbhio_mode_t\s+gdbMode\s*=\s*0\s*;\s*$'
          )

          match = pattern.search(text)

          if match:
              replacement = (
                  match.group(1)
                  + "gdbhio_mode_t gdbMode "
                    "__attribute__((unused)) = 0;"
              )

              text = (
                  text[:match.start()]
                  + replacement
                  + text[match.end():]
              )

              p.write_text(text)

              print("gdbMode patched.")

          elif "__attribute__((unused))" in text and "gdbMode" in text:
              print("gdbMode already patched.")

          else:
              raise SystemExit(
                  "ERROR: gdbMode declaration not found."
              )
          PY

          cd "$LIBCTRU_ROOT"

          make -j2
          make install

          echo "libctru complete."


      # ============================================================
      # BUILD CITRO3D
      # ============================================================

      - name: Build citro3d
        shell: bash
        run: |
          set -e

          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM

          export PATH="/opt/devkitpro/portlibs/3ds/bin:$PATH"
          export PATH="/opt/devkitpro/tools/bin:$PATH"
          export PATH="/opt/devkitpro/devkitARM/bin:$PATH"

          cd /tmp

          rm -rf /tmp/citro3d
          mkdir -p /tmp/citro3d

          wget -O citro3d.tar.gz \
            https://github.com/devkitPro/citro3d/archive/refs/tags/v1.7.1.tar.gz

          tar \
            -xzf citro3d.tar.gz \
            -C /tmp/citro3d

          CITRO3D_ROOT="/tmp/citro3d/citro3d-1.7.1"

          test -f "$CITRO3D_ROOT/Makefile"

          cd "$CITRO3D_ROOT"

          make -j2
          make install

          echo "citro3d complete."


      # ============================================================
      # BUILD CITRO2D
      # ============================================================

      - name: Build citro2d
        shell: bash
        run: |
          set -e

          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM

          export PATH="/opt/devkitpro/portlibs/3ds/bin:$PATH"
          export PATH="/opt/devkitpro/tools/bin:$PATH"
          export PATH="/opt/devkitpro/devkitARM/bin:$PATH"

          cd /tmp

          rm -rf /tmp/citro2d
          mkdir -p /tmp/citro2d

          wget -O citro2d.tar.gz \
            https://github.com/devkitPro/citro2d/archive/refs/tags/v1.7.0.tar.gz

          tar \
            -xzf citro2d.tar.gz \
            -C /tmp/citro2d

          CITRO2D_ROOT="/tmp/citro2d/citro2d-1.7.0"

          test -f "$CITRO2D_ROOT/CMakeLists.txt"

          test -f "$CITRO2D_ROOT/Catnip.cmake"

          cd "$CITRO2D_ROOT"

          catnip \
            -T 3DS \
            build

          catnip \
            -T 3DS \
            install

          echo "======================================"
          echo "CITRO2D BUILD/INSTALL COMPLETE"
          echo "======================================"


      # ============================================================
      # VERIFY 3DS LIBRARIES
      # ============================================================

      - name: Verify 3DS libraries
        shell: bash
        run: |
          set -e

          find /opt/devkitpro \
            -name libctru.a \
            -print

          find /opt/devkitpro \
            -name libcitro3d.a \
            -print

          find /opt/devkitpro \
            -name libcitro2d.a \
            -print

          test -f \
            /opt/devkitpro/libctru/lib/libctru.a

          test -f \
            /opt/devkitpro/libctru/lib/libcitro3d.a

          test -f \
            /opt/devkitpro/libctru/lib/libcitro2d.a

          echo "======================================"
          echo "ALL 3DS LIBRARIES FOUND"
          echo "======================================"


      # ============================================================
      # DOWNLOAD mGBA SOURCE
      # ============================================================

      - name: Download mGBA source
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "DOWNLOADING mGBA 0.10.5"
          echo "======================================"

          PROJECT_PARENT="$GITHUB_WORKSPACE"

          cd "$PROJECT_PARENT"

          rm -rf mgba
          rm -rf /tmp/mgba-download

          mkdir -p /tmp/mgba-download

          wget -O /tmp/mgba.tar.gz \
            https://github.com/mgba-emu/mgba/archive/refs/tags/0.10.5.tar.gz

          tar \
            -xzf /tmp/mgba.tar.gz \
            -C /tmp/mgba-download

          EXTRACTED_MGBA="$(
            find /tmp/mgba-download \
              -maxdepth 1 \
              -type d \
              -name 'mgba-*' \
              -print \
              -quit
          )"

          if [ -z "$EXTRACTED_MGBA" ]; then
            echo "ERROR: mGBA source extraction failed."
            exit 1
          fi

          mv \
            "$EXTRACTED_MGBA" \
            "$PROJECT_PARENT/mgba"

          echo "mGBA source installed at:"
          echo "$PROJECT_PARENT/mgba"

          test -f \
            "$PROJECT_PARENT/mgba/CMakeLists.txt"

          echo "mGBA CMakeLists.txt found."


      # ============================================================
      # VERIFY mGBA
      # ============================================================

      - name: Verify mGBA source
        shell: bash
        run: |
          set -e

          test -f \
            "$GITHUB_WORKSPACE/mgba/CMakeLists.txt"

          test -f \
            "$GITHUB_WORKSPACE/mgba/src/platform/3ds/CMakeToolchain.txt"

          echo "======================================"
          echo "mGBA SOURCE VERIFIED"
          echo "======================================"

          echo "mGBA directory:"
          echo "$GITHUB_WORKSPACE/mgba"

          echo ""
          echo "CMakeLists:"
          ls -lh \
            "$GITHUB_WORKSPACE/mgba/CMakeLists.txt"


      # ============================================================
      # LOCATE HOENN REBORN
      # ============================================================

      - name: Locate Hoenn Reborn project
        shell: bash
        run: |
          set -e

          SEARCH_ROOT="$GITHUB_WORKSPACE/hoenn_project"

          MAIN_FILE="$(
            find "$SEARCH_ROOT" \
              -type f \
              -path '*/source/main.c' \
              -print \
              -quit
          )"

          if [ -z "$MAIN_FILE" ]; then
            echo "ERROR: source/main.c not found."

            find "$SEARCH_ROOT" \
              -maxdepth 6 \
              -type f \
              -print

            exit 1
          fi

          PROJECT_ROOT="$(dirname "$(dirname "$MAIN_FILE")")"

          echo "Found:"
          echo "$MAIN_FILE"

          echo ""
          echo "Project root:"
          echo "$PROJECT_ROOT"

          test -f "$PROJECT_ROOT/Makefile"
          test -f "$PROJECT_ROOT/cia.rsf"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"


      # ============================================================
      # VERIFY PROJECT
      # ============================================================

      - name: Verify project structure
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          test -f Makefile
          test -f cia.rsf

          test -f source/main.c
          test -f source/dashboard.c
          test -f source/game_data.c
          test -f source/gba_core_mgba.c

          test -d romfs/hoenn_reborn

          echo "======================================"
          echo "PROJECT FILES VERIFIED"
          echo "======================================"


      # ============================================================
      # PATCH MAKEFILE
      # ============================================================

      - name: Patch Hoenn Reborn Makefile
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("Makefile")

          text = p.read_text()

          text = text.replace(
              "mgba-static",
              "mgba"
          )

          p.write_text(text)

          print("Makefile patched.")
          PY

          echo ""
          echo "mGBA references:"
          grep -n "MGBA" Makefile || true


      # ============================================================
      # BUILD HOENN REBORN
      # ============================================================

      - name: Build Hoenn Reborn
        shell: bash
        run: |
          set -e

          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM

          export PATH="/opt/devkitpro/portlibs/3ds/bin:$PATH"
          export PATH="/opt/devkitpro/tools/bin:$PATH"
          export PATH="/opt/devkitpro/devkitARM/bin:$PATH"

          cd "$PROJECT_ROOT"

          echo "======================================"
          echo "HOENN REBORN BUILD"
          echo "======================================"

          echo ""
          echo "Project:"
          echo "$PROJECT_ROOT"

          echo ""
          echo "mGBA:"
          echo "$GITHUB_WORKSPACE/mgba"

          echo ""
          echo "Compiler:"
          arm-none-eabi-gcc --version

          echo ""
          echo "Starting make..."

          make -j2

          echo ""
          echo "======================================"
          echo "HOENN REBORN BUILD FINISHED"
          echo "======================================"


      # ============================================================
      # VERIFY CIA
      # ============================================================

      - name: Verify CIA
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          test -f Hoenn_Reborn.cia

          echo "======================================"
          echo "CIA BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh Hoenn_Reborn.cia
          wc -c Hoenn_Reborn.cia


      # ============================================================
      # VERIFY 3DSX
      # ============================================================

      - name: Verify 3DSX
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          test -f Hoenn_Reborn.3dsx

          echo "======================================"
          echo "3DSX BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh Hoenn_Reborn.3dsx
          wc -c Hoenn_Reborn.3dsx


      # ============================================================
      # VERIFY ELF
      # ============================================================

      - name: Verify ELF
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          test -f Hoenn_Reborn.elf

          echo "======================================"
          echo "ELF BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh Hoenn_Reborn.elf
          wc -c Hoenn_Reborn.elf


      # ============================================================
      # PREPARE ARTIFACTS
      # ============================================================

      - name: Prepare build artifacts
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          rm -rf "$GITHUB_WORKSPACE/final_build"

          mkdir -p "$GITHUB_WORKSPACE/final_build"

          cp Hoenn_Reborn.cia \
            "$GITHUB_WORKSPACE/final_build/"

          cp Hoenn_Reborn.3dsx \
            "$GITHUB_WORKSPACE/final_build/"

          cp Hoenn_Reborn.elf \
            "$GITHUB_WORKSPACE/final_build/"

          if [ -f Hoenn_Reborn.smdh ]; then
            cp Hoenn_Reborn.smdh \
              "$GITHUB_WORKSPACE/final_build/"
          fi

          if [ -f Hoenn_Reborn.bnr ]; then
            cp Hoenn_Reborn.bnr \
              "$GITHUB_WORKSPACE/final_build/"
          fi

          ls -lh \
            "$GITHUB_WORKSPACE/final_build/"


      # ============================================================
      # UPLOAD CIA
      # ============================================================

      - name: Upload CIA
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-CIA
          path: final_build/Hoenn_Reborn.cia
          if-no-files-found: error


      # ============================================================
      # UPLOAD 3DSX
      # ============================================================

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-3DSX
          path: final_build/Hoenn_Reborn.3dsx
          if-no-files-found: error


      # ============================================================
      # UPLOAD ELF
      # ============================================================

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-ELF
          path: final_build/Hoenn_Reborn.elf
          if-no-files-found: error


      # ============================================================
      # UPLOAD ALL BUILD FILES
      # ============================================================

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-Build-Files
          path: final_build/*
          if-no-files-found: error
