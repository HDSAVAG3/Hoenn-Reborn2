name: Build Hoenn Reborn

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CIA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host tools
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            curl \
            git \
            cmake \
            make \
            python3 \
            unzip \
            xz-utils \
            zstd \
            p7zip-full

      - name: Prepare devkitARM
        shell: bash
        run: |
          set -e

          docker pull devkitpro/devkitarm:latest

          mkdir -p "$GITHUB_WORKSPACE/toolchain"

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            devkitpro/devkitarm:latest \
            bash -lc '
              echo "DEVKITPRO=$DEVKITPRO"
              echo "DEVKITARM=$DEVKITARM"
              "$DEVKITARM/bin/arm-none-eabi-gcc" --version
            '

      - name: Find project
        shell: bash
        run: |
          set -e

          echo "Workspace:"
          ls -la

          if [ -f "Makefile" ]; then
            echo "Project found in repository root."
            exit 0
          fi

          if [ -f "Hoenn_Reborn_GitHub_Build.zip" ]; then
            echo "Found project ZIP."
            unzip -o "Hoenn_Reborn_GitHub_Build.zip"
          fi

          if [ -f "Hoenn_Reborn_GitHub_Build/Makefile" ]; then
            cp -a Hoenn_Reborn_GitHub_Build/. .
          fi

          if [ ! -f "Makefile" ]; then
            echo "ERROR: Could not find the Hoenn Reborn Makefile."
            echo "Files currently in workspace:"
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          echo "Project is ready."

      - name: Build 3DS libraries and project
        shell: bash
        run: |
          set -e

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            devkitpro/devkitarm:latest \
            bash -lc '

              set -e

              export DEVKITPRO=/opt/devkitpro
              export DEVKITARM=/opt/devkitpro/devkitARM
              export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

              echo "========================================"
              echo "DEVKITARM"
              echo "========================================"

              "$DEVKITARM/bin/arm-none-eabi-gcc" --version

              echo "========================================"
              echo "Build directories"
              echo "========================================"

              mkdir -p /tmp/3ds-libs
              cd /tmp/3ds-libs

              echo "========================================"
              echo "libctru"
              echo "========================================"

              rm -rf libctru-2.7.0

              wget -q \
                https://github.com/devkitPro/libctru/archive/refs/tags/v2.7.0.tar.gz \
                -O libctru.tar.gz

              tar -xzf libctru.tar.gz

              cd libctru-2.7.0/libctru

              python3 - <<'"'"'PY'"'"'
from pathlib import Path

p = Path("source/gdbhio.c")

if p.exists():
    s = p.read_text()

    old = "gdbhio_mode_t gdbMode = 0;"

    new = "gdbhio_mode_t gdbMode __attribute__((unused)) = 0;"

    if old in s:
        s = s.replace(old, new)
        p.write_text(s)
        print("Patched gdbMode warning.")
    else:
        print("gdbMode line already patched or changed.")
PY

              make -j2
              make install

              echo "========================================"
              echo "citro3d"
              echo "========================================"

              cd /tmp/3ds-libs

              rm -rf citro3d-1.6.2

              wget -q \
                https://github.com/devkitPro/citro3d/archive/refs/tags/v1.6.2.tar.gz \
                -O citro3d.tar.gz

              tar -xzf citro3d.tar.gz

              cd citro3d-1.6.2

              make -j2
              make install

              echo "========================================"
              echo "citro2d"
              echo "========================================"

              cd /tmp/3ds-libs

              rm -rf citro2d-1.7.0

              wget -q \
                https://github.com/devkitPro/citro2d/archive/refs/tags/v1.7.0.tar.gz \
                -O citro2d.tar.gz

              tar -xzf citro2d.tar.gz

              cd citro2d-1.7.0

              echo "Checking citro2d..."

              if [ -f "Makefile" ]; then
                make -j2
                make install
              else
                echo "citro2d Makefile not present."
                echo "Using CMake build."

                mkdir build
                cd build

                cmake .. \
                  -DCMAKE_TOOLCHAIN_FILE="$DEVKITARM/3ds_rules"

                make -j2
                make install
              fi

              echo "========================================"
              echo "3DS libraries complete"
              echo "========================================"

              ls -lh "$DEVKITPRO/libctru/lib" || true

              echo "========================================"
              echo "mGBA"
              echo "========================================"

              cd /work

              rm -rf mgba

              wget -q \
                https://github.com/mgba-emu/mgba/archive/refs/tags/0.10.5.tar.gz \
                -O mgba.tar.gz

              tar -xzf mgba.tar.gz

              mv mgba-0.10.5 mgba

              CONFIG="mgba/src/feature/gui/gui-config.c"

              python3 - "$CONFIG" <<'"'"'PY'"'"'
import sys
from pathlib import Path

path = Path(sys.argv[1])
text = path.read_text()

old = """            if (gbBiosPath[0]) {
                mCoreConfigSetValue(&runner->config, "gb.bios", gbBiosPath);
            }
            if (gbcBiosPath[0]) {
                mCoreConfigSetValue(&runner->config, "gbc.bios", gbcBiosPath);
            }
            if (sgbBiosPath[0]) {
                mCoreConfigSetValue(&runner->config, "sgb.bios", sgbBiosPath);
            }
"""

new = """#ifdef M_CORE_GB
            if (gbBiosPath[0]) {
                mCoreConfigSetValue(&runner->config, "gb.bios", gbBiosPath);
            }
            if (gbcBiosPath[0]) {
                mCoreConfigSetValue(&runner->config, "gbc.bios", gbcBiosPath);
            }
            if (sgbBiosPath[0]) {
                mCoreConfigSetValue(&runner->config, "sgb.bios", sgbBiosPath);
            }
#endif
"""

if old in text:
    text = text.replace(old, new)
    path.write_text(text)
    print("mGBA GBA-only GUI patch applied.")
else:
    print("mGBA GUI block was already patched or has changed.")
PY

              rm -rf mgba/build-hoenn-3ds

              cmake -S mgba \
                -B mgba/build-hoenn-3ds \
                -DCMAKE_TOOLCHAIN_FILE="$DEVKITARM/3ds/CMakeToolchain.txt" \
                -D3DS=ON \
                -DLIBMGBA_ONLY=ON \
                -DBUILD_STATIC=ON \
                -DBUILD_SHARED=OFF \
                -DM_CORE_GBA=ON \
                -DM_CORE_GB=OFF \
                -DDISABLE_DEPS=ON \
                -DBUILD_LTO=OFF

              cmake --build mgba/build-hoenn-3ds \
                --target mgba \
                -j2

              mkdir -p mgba/build-hoenn-3ds/include

              find mgba/build-hoenn-3ds \
                -name "libmgba.a" \
                -print

              MGBA_LIB=$(find mgba/build-hoenn-3ds \
                -name "libmgba.a" \
                -print -quit)

              if [ -z "$MGBA_LIB" ]; then
                echo "ERROR: libmgba.a was not produced."
                exit 1
              fi

              mkdir -p mgba/build-hoenn-3ds/lib
              cp "$MGBA_LIB" mgba/build-hoenn-3ds/lib/libmgba-static.a

              echo "mGBA library:"
              ls -lh mgba/build-hoenn-3ds/lib/libmgba-static.a

              echo "========================================"
              echo "Patch project Makefile"
              echo "========================================"

              if [ -f Makefile ]; then
                sed -i 's/mgba-static/mgba/g' Makefile
              fi

              echo "========================================"
              echo "Project Makefile"
              echo "========================================"

              sed -n '1,220p' Makefile

              echo "========================================"
              echo "Build Hoenn Reborn"
              echo "========================================"

              make clean || true

              make -j2

              echo "========================================"
              echo "BUILD COMPLETE"
              echo "========================================"

              ls -lh \
                Hoenn_Reborn.cia \
                Hoenn_Reborn.3dsx \
                Hoenn_Reborn.elf \
                Hoenn_Reborn.smdh \
                Hoenn_Reborn.bnr
            '

      - name: Verify output
        shell: bash
        run: |
          set -e

          echo "Final build files:"

          find . \
            -maxdepth 3 \
            -type f \
            \( \
              -name "*.cia" \
              -o -name "*.3dsx" \
              -o -name "*.elf" \
            \) \
            -print

          CIA=$(find . -maxdepth 3 -name "*.cia" -print -quit)

          if [ -z "$CIA" ]; then
            echo "ERROR: No CIA was produced."
            exit 1
          fi

          echo "CIA found:"
          ls -lh "$CIA"

      - name: Upload CIA
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-CIA
          path: |
            **/*.cia
            **/*.3dsx
            **/*.elf
          if-no-files-found: error
