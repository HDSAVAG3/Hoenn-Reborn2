name: Build Hoenn Reborn

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build tools
        run: |
          apt-get update
          apt-get install -y \
            wget \
            curl \
            git \
            cmake \
            make \
            python3 \
            unzip \
            xz-utils \
            zstd \
            file

      - name: Configure devkitPro environment
        shell: bash
        run: |
          echo "/opt/devkitpro/devkitARM/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"

          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM

          echo "DEVKITPRO=$DEVKITPRO" >> "$GITHUB_ENV"
          echo "DEVKITARM=$DEVKITARM" >> "$GITHUB_ENV"

      # ============================================================
      # 3DS TOOLS
      # ============================================================

      - name: Install 3dstools
        shell: bash
        run: |
          set -e

          cd /tmp

          wget -O 3dstools.pkg.tar.zst \
            https://wii.leseratte10.de/devkitPro/other-stuff/3dstools/3dstools-1.3.1-3-linux_x86_64.pkg.tar.zst

          mkdir -p /tmp/3dstools

          tar \
            --use-compress-program=unzstd \
            -xf 3dstools.pkg.tar.zst \
            -C /tmp/3dstools

          echo "Extracted 3dstools package."

          find /tmp/3dstools -type f | head -50

          # Copy installed tools into devkitPro tools directory.
          if [ -d /tmp/3dstools/opt/devkitpro/tools ]; then
            cp -a \
              /tmp/3dstools/opt/devkitpro/tools/. \
              /opt/devkitpro/tools/
          fi

          # Some packages use usr/bin.
          if [ -d /tmp/3dstools/usr/bin ]; then
            cp -a \
              /tmp/3dstools/usr/bin/. \
              /opt/devkitpro/tools/bin/
          fi

          chmod +x /opt/devkitpro/tools/bin/* 2>/dev/null || true

          echo "3dstools installation complete."

      - name: Install bannertool
        shell: bash
        run: |
          set -e

          cd /tmp

          wget -O bannertool.zip \
            https://github.com/devkitPro/bannertool/releases/download/1.2.2/bannertool.zip

          rm -rf /tmp/bannertool
          mkdir -p /tmp/bannertool

          unzip -q bannertool.zip -d /tmp/bannertool

          BANNERTOOL_BIN="$(find /tmp/bannertool \
            -type f \
            -name bannertool \
            -path '*linux-x86_64*' \
            -print \
            -quit)"

          if [ -z "$BANNERTOOL_BIN" ]; then
            BANNERTOOL_BIN="$(find /tmp/bannertool \
              -type f \
              -name bannertool \
              -print \
              -quit)"
          fi

          test -n "$BANNERTOOL_BIN"

          chmod +x "$BANNERTOOL_BIN"

          cp "$BANNERTOOL_BIN" \
            /opt/devkitpro/tools/bin/bannertool

          test -x /opt/devkitpro/tools/bin/bannertool

      - name: Install makerom
        shell: bash
        run: |
          set -e

          cd /tmp

          wget -O makerom.zip \
            https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip

          rm -rf /tmp/makerom
          mkdir -p /tmp/makerom

          unzip -q makerom.zip -d /tmp/makerom

          MAKEROM_BIN="$(find /tmp/makerom \
            -type f \
            -name makerom \
            -print \
            -quit)"

          test -n "$MAKEROM_BIN"

          chmod +x "$MAKEROM_BIN"

          cp "$MAKEROM_BIN" \
            /opt/devkitpro/tools/bin/makerom

          test -x /opt/devkitpro/tools/bin/makerom

      - name: Verify 3DS tools
        shell: bash
        run: |
          set -e

          echo "Checking arm-none-eabi-gcc..."
          command -v arm-none-eabi-gcc

          echo "Checking bannertool..."
          command -v bannertool

          echo "Checking makerom..."
          command -v makerom

          echo "Checking tex3ds..."
          command -v tex3ds

          echo "Checking 3dsxtool..."
          command -v 3dsxtool

          echo "3DS tools are ready."

      # ============================================================
      # LIBCTRU
      # ============================================================

      - name: Build libctru
        shell: bash
        run: |
          set -e

          cd /tmp

          rm -rf /tmp/libctru
          mkdir -p /tmp/libctru

          wget -O libctru.tar.gz \
            https://github.com/devkitPro/libctru/archive/refs/tags/v2.7.0.tar.gz

          tar -xzf libctru.tar.gz \
            -C /tmp/libctru

          LIBCTRU_ROOT="$(
            find /tmp/libctru/libctru-2.7.0 \
              -type f \
              -name Makefile \
              -print \
              -quit \
              | xargs dirname
          )"

          echo "libctru Makefile directory:"
          echo "$LIBCTRU_ROOT"

          test -n "$LIBCTRU_ROOT"
          test -f "$LIBCTRU_ROOT/Makefile"

          GDBHIO_FILE="$(
            find /tmp/libctru/libctru-2.7.0 \
              -type f \
              -name gdbhio.c \
              -print \
              -quit
          )"

          test -n "$GDBHIO_FILE"

          echo "Patching:"
          echo "$GDBHIO_FILE"

          python3 - "$GDBHIO_FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          pattern = re.compile(
              r'(?m)^(\s*)gdbMode_t\s+gdbMode\s*=\s*0\s*;'
          )

          m = pattern.search(s)

          if not m:
              raise SystemExit(
                  "Could not find gdbMode declaration"
              )

          replacement = (
              m.group(1)
              + "gdbMode_t gdbMode __attribute__((unused)) = 0;"
          )

          s = (
              s[:m.start()]
              + replacement
              + s[m.end():]
          )

          p.write_text(s)

          print("libctru gdbMode patch complete.")
          PY

          cd "$LIBCTRU_ROOT"

          echo "Building libctru from:"
          pwd

          make -j2
          make install

          echo "libctru build/install complete."

      # ============================================================
      # CITRO3D
      # ============================================================

      - name: Build citro3d
        shell: bash
        run: |
          set -e

          cd /tmp

          rm -rf /tmp/citro3d
          mkdir -p /tmp/citro3d

          wget -O citro3d.tar.gz \
            https://github.com/devkitPro/citro3d/archive/refs/tags/v1.7.1.tar.gz

          tar -xzf citro3d.tar.gz \
            -C /tmp/citro3d

          CITRO3D_ROOT="/tmp/citro3d/citro3d-1.7.1"

          test -f "$CITRO3D_ROOT/Makefile"

          cd "$CITRO3D_ROOT"

          make -j2
          make install

          echo "citro3d build/install complete."

      # ============================================================
      # CITRO2D
      # ============================================================

      - name: Build citro2d
        shell: bash
        run: |
          set -e

          cd /tmp

          rm -rf /tmp/citro2d
          mkdir -p /tmp/citro2d

          wget -O citro2d.tar.gz \
            https://github.com/devkitPro/citro2d/archive/refs/tags/v1.7.0.tar.gz

          tar -xzf citro2d.tar.gz \
            -C /tmp/citro2d

          CITRO2D_ROOT="/tmp/citro2d/citro2d-1.7.0"

          test -f "$CITRO2D_ROOT/CMakeLists.txt"

          cmake \
            -S "$CITRO2D_ROOT" \
            -B "$CITRO2D_ROOT/build" \
            -DCMAKE_INSTALL_PREFIX=/opt/devkitpro/libctru

          cmake \
            --build "$CITRO2D_ROOT/build" \
            -j2

          cmake \
            --install "$CITRO2D_ROOT/build"

          echo "citro2d build/install complete."

      # ============================================================
      # VERIFY 3DS LIBRARIES
      # ============================================================

      - name: Verify 3DS libraries
        shell: bash
        run: |
          set -e

          echo "Searching for libctru..."
          find /opt/devkitpro \
            -name 'libctru.a' \
            -print

          echo "Searching for libcitro3d..."
          find /opt/devkitpro \
            -name 'libcitro3d.a' \
            -print

          echo "Searching for libcitro2d..."
          find /opt/devkitpro \
            -name 'libcitro2d.a' \
            -print

          test -f /opt/devkitpro/libctru/lib/libctru.a
          test -f /opt/devkitpro/libctru/lib/libcitro3d.a
          test -f /opt/devkitpro/libctru/lib/libcitro2d.a

          echo "All 3DS libraries found."

      # ============================================================
      # PATCH PROJECT MAKEFILE
      # ============================================================

      - name: Patch Hoenn Reborn Makefile
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("Makefile")
          s = p.read_text()

          s = s.replace(
              "mgba-static",
              "mgba"
          )

          p.write_text(s)

          print("Hoenn Reborn Makefile patched.")
          PY

      - name: Verify Makefile
        shell: bash
        run: |
          set -e

          test -f Makefile
          test -f cia.rsf
          test -f source/main.c
          test -f source/dashboard.c
          test -f source/game_data.c
          test -f source/gba_core_mgba.c

          echo "Project files verified."

      # ============================================================
      # BUILD HOENN REBORN
      # ============================================================

      - name: Build Hoenn Reborn
        shell: bash
        run: |
          set -e

          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM

          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"

          arm-none-eabi-gcc --version

          make -j2

      # ============================================================
      # VERIFY OUTPUT
      # ============================================================

      - name: Verify CIA
        shell: bash
        run: |
          test -f Hoenn_Reborn.cia
          ls -lh Hoenn_Reborn.cia
          wc -c Hoenn_Reborn.cia

      - name: Verify 3DSX
        shell: bash
        run: |
          test -f Hoenn_Reborn.3dsx
          ls -lh Hoenn_Reborn.3dsx
          wc -c Hoenn_Reborn.3dsx

      - name: Verify ELF
        shell: bash
        run: |
          test -f Hoenn_Reborn.elf
          ls -lh Hoenn_Reborn.elf
          wc -c Hoenn_Reborn.elf

      # ============================================================
      # UPLOAD BUILD ARTIFACTS
      # ============================================================

      - name: Upload CIA
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-CIA
          path: Hoenn_Reborn.cia
          if-no-files-found: error

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-3DSX
          path: Hoenn_Reborn.3dsx
          if-no-files-found: error

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-ELF
          path: Hoenn_Reborn.elf
          if-no-files-found: error

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-Build-Files
          path: |
            Hoenn_Reborn.cia
            Hoenn_Reborn.3dsx
            Hoenn_Reborn.elf
            Hoenn_Reborn.smdh
            Hoenn_Reborn.bnr
          if-no-files-found: warn
