name: Build Hoenn Reborn

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CIA
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host tools
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            curl \
            git \
            cmake \
            make \
            python3 \
            unzip \
            xz-utils \
            zstd \
            p7zip-full

      - name: Prepare project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Checking project"
          echo "========================================"

          if [ -f "Makefile" ]; then
            echo "Makefile found."
          elif [ -f "Hoenn_Reborn_GitHub_Build.zip" ]; then
            echo "Project ZIP found."
            unzip -o "Hoenn_Reborn_GitHub_Build.zip"

            if [ -f "Hoenn_Reborn_GitHub_Build/Makefile" ]; then
              cp -a Hoenn_Reborn_GitHub_Build/. .
            fi
          fi

          if [ ! -f "Makefile" ]; then
            echo "ERROR: Makefile not found."
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          echo "Project ready."

      - name: Create Docker build script
        shell: bash
        run: |
          set -e

          cat > build-inside.sh <<'BUILD_SCRIPT'
          #!/usr/bin/env bash

          set -e

          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          echo "========================================"
          echo "INSIDE DEVKITARM CONTAINER"
          echo "========================================"

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"

          "$DEVKITARM/bin/arm-none-eabi-gcc" --version

          echo "========================================"
          echo "Installing 3DS packaging tools"
          echo "========================================"

          mkdir -p /tmp/tools

          cd /tmp/tools

          wget -q \
            https://github.com/Steveice10/bannertool/releases/download/1.2.2/bannertool.zip \
            -O bannertool.zip

          unzip -o bannertool.zip

          BANNERTOOL=$(find /tmp/tools -type f -name bannertool | head -1)

          if [ -z "$BANNERTOOL" ]; then
            echo "ERROR: bannertool was not found."
            find /tmp/tools -maxdepth 4 -type f
            exit 1
          fi

          chmod +x "$BANNERTOOL"

          cp "$BANNERTOOL" "$DEVKITPRO/tools/bin/bannertool"

          wget -q \
            https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip \
            -O makerom.zip

          unzip -o makerom.zip

          MAKEROM=$(find /tmp/tools -type f -name makerom | head -1)

          if [ -z "$MAKEROM" ]; then
            echo "ERROR: makerom was not found."
            find /tmp/tools -maxdepth 4 -type f
            exit 1
          fi

          chmod +x "$MAKEROM"

          cp "$MAKEROM" "$DEVKITPRO/tools/bin/makerom"

          echo "bannertool:"
          bannertool --help >/dev/null 2>&1 || true

          echo "makerom:"
          makerom -h >/dev/null 2>&1 || true

          echo "========================================"
          echo "Installing tex3ds"
          echo "========================================"

          cd /tmp/tools

          rm -rf tex3ds

          git clone -q \
            --depth 1 \
            --branch v2.3.0 \
            https://github.com/devkitPro/tex3ds.git \
            tex3ds

          cd tex3ds

          ./autogen.sh

          ./configure \
            --prefix="$DEVKITPRO/tools"

          make -j2

          make install

          export PATH="$DEVKITPRO/tools/bin:$PATH"

          echo "tex3ds:"
          command -v tex3ds
          tex3ds --version || true

          echo "========================================"
          echo "Building libctru"
          echo "========================================"

          cd /tmp

          rm -rf libctru-2.7.0

          wget -q \
            https://github.com/devkitPro/libctru/archive/refs/tags/v2.7.0.tar.gz \
            -O libctru.tar.gz

          tar -xzf libctru.tar.gz

          cd libctru-2.7.0/libctru

          sed -i \
            's/gdbhio_mode_t gdbMode = 0;/gdbhio_mode_t gdbMode __attribute__((unused)) = 0;/' \
            source/gdbhio.c

          make -j2

          make install

          echo "libctru complete."

          echo "========================================"
          echo "Building citro3d"
          echo "========================================"

          cd /tmp

          rm -rf citro3d-1.7.1

          wget -q \
            https://github.com/devkitPro/citro3d/archive/refs/tags/v1.7.1.tar.gz \
            -O citro3d.tar.gz

          tar -xzf citro3d.tar.gz

          cd citro3d-1.7.1

          make -j2

          make install

          echo "citro3d complete."

          echo "========================================"
          echo "Building citro2d"
          echo "========================================"

          cd /tmp

          rm -rf citro2d-1.6.0

          wget -q \
            https://github.com/devkitPro/citro2d/archive/refs/tags/v1.6.0.tar.gz \
            -O citro2d.tar.gz

          tar -xzf citro2d.tar.gz

          cd citro2d-1.6.0

          sed -i \
            's/void C2D_Fade(u32 color)/bool C2D_Fade(u32 color)/' \
            source/base.c

          sed -i \
            's/void C2D_SetTintMode(C2D_TintMode mode)/bool C2D_SetTintMode(C2D_TintMode mode)/' \
            source/base.c

          sed -i \
            's/void C2D_Fade(u32 color)/bool C2D_Fade(u32 color)/' \
            include/citro2d.h

          sed -i \
            's/void C2D_SetTintMode(C2D_TintMode mode)/bool C2D_SetTintMode(C2D_TintMode mode)/' \
            include/citro2d.h

          sed -i \
            '/ctx->fadeClr = color;/a\    return true;' \
            source/base.c

          sed -i \
            '/ctx->flags = (ctx->flags \&~ C2DiF_TintMode_Mask) | (new_mode << (C2DiF_TintMode_Shift - C2DiF_Mode_Shift));/a\    return true;' \
            source/base.c

          make -j2

          make install

          echo "citro2d complete."

          echo "========================================"
          echo "Building mGBA 0.10.5"
          echo "========================================"

          cd /work

          rm -rf mgba
          rm -f mgba.tar.gz

          wget -q \
            https://github.com/mgba-emu/mgba/archive/refs/tags/0.10.5.tar.gz \
            -O mgba.tar.gz

          tar -xzf mgba.tar.gz

          mv mgba-0.10.5 mgba

          echo "Patching mGBA GBA-only GUI..."

          CONFIG="mgba/src/feature/gui/gui-config.c"

          if [ -f "$CONFIG" ]; then

            sed -i \
              '/if (gbBiosPath\[0\])/i #ifdef M_CORE_GB' \
              "$CONFIG"

            sed -i \
              '/mCoreConfigSetValue(&runner->config, "sgb.bios", sgbBiosPath);/a #endif' \
              "$CONFIG"

          fi

          echo "mGBA patch complete."

          echo "========================================"
          echo "Configuring mGBA"
          echo "========================================"

          rm -rf mgba/build-hoenn-3ds

          cmake \
            -S mgba \
            -B mgba/build-hoenn-3ds \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITARM/3ds/CMakeToolchain.txt" \
            -D3DS=ON \
            -DLIBMGBA_ONLY=ON \
            -DBUILD_STATIC=ON \
            -DBUILD_SHARED=OFF \
            -DM_CORE_GBA=ON \
            -DM_CORE_GB=OFF \
            -DDISABLE_DEPS=ON \
            -DBUILD_LTO=OFF

          echo "========================================"
          echo "Compiling mGBA"
          echo "========================================"

          cmake \
            --build mgba/build-hoenn-3ds \
            --target mgba \
            -j2

          MGBA_LIB=$(find mgba/build-hoenn-3ds \
            -name "libmgba.a" \
            -print -quit)

          if [ -z "$MGBA_LIB" ]; then
            echo "ERROR: libmgba.a was not produced."

            find mgba/build-hoenn-3ds \
              -name "*.a" \
              -print

            exit 1
          fi

          mkdir -p mgba/build-hoenn-3ds/lib

          cp "$MGBA_LIB" \
            mgba/build-hoenn-3ds/lib/libmgba-static.a

          echo "mGBA library created."

          ls -lh \
            mgba/build-hoenn-3ds/lib/libmgba-static.a

          echo "========================================"
          echo "Preparing project"
          echo "========================================"

          sed -i \
            's/mgba-static/mgba/g' \
            Makefile

          echo "========================================"
          echo "PROJECT MAKEFILE"
          echo "========================================"

          sed -n '1,240p' Makefile

          echo "========================================"
          echo "BUILDING HOENN REBORN"
          echo "========================================"

          make clean || true

          make -j2

          echo "========================================"
          echo "BUILD COMPLETE"
          echo "========================================"

          find . \
            -maxdepth 4 \
            -type f \
            \( \
              -name "*.cia" \
              -o -name "*.3dsx" \
              -o -name "*.elf" \
            \) \
            -print

          BUILD_SCRIPT

          chmod +x build-inside.sh

          echo "Created build-inside.sh:"
          ls -lh build-inside.sh

      - name: Run build inside devkitARM
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "STARTING DOCKER BUILD"
          echo "========================================"

          docker pull devkitpro/devkitarm:latest

          docker run \
            --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            devkitpro/devkitarm:latest \
            bash /work/build-inside.sh

      - name: Verify CIA
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SEARCHING FOR CIA"
          echo "========================================"

          find . \
            -maxdepth 5 \
            -type f \
            \( \
              -name "*.cia" \
              -o -name "*.3dsx" \
              -o -name "*.elf" \
            \) \
            -print

          CIA=$(find . \
            -maxdepth 5 \
            -name "*.cia" \
            -print \
            -quit)

          if [ -z "$CIA" ]; then
            echo "ERROR: No CIA file was produced."
            exit 1
          fi

          echo "========================================"
          echo "CIA FOUND"
          echo "========================================"

          ls -lh "$CIA"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Hoenn-Reborn-Build
          path: |
            **/*.cia
            **/*.3dsx
            **/*.elf
          if-no-files-found: error
